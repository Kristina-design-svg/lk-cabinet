<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет клиента</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #F5F5F5;
      --card: #FFFFFF;
      --accent: #4A76A8;
      --accent-dark: #3F6795;
      --accent-soft: #E8F0FA;
      --text: #000000;
      --muted: #818C99;
      --line: #DCE1E6;
      --danger: #E64646;
      --success: #2EA44F;
      --warning: #F5A623;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --radius: 12px;
      --sidebar: 240px;
      --header: 64px;
    }

    html,
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    body.locked {
      overflow: hidden;
    }

    button,
    input,
    textarea,
    select {
      font-family: 'Manrope', Arial, sans-serif;
      font-size: 15px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      padding: 0 16px;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s ease;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      background: #EEF2F6;
      color: #2C4058;
    }

    button.secondary:hover {
      background: #E3EAF2;
    }

    button.ghost {
      background: transparent;
      color: var(--accent);
      padding: 0;
      min-height: auto;
    }

    button.danger {
      background: var(--danger);
    }

    button.success {
      background: var(--success);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 28px;
      line-height: 1.15;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 20px;
      line-height: 1.2;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 17px;
      line-height: 1.25;
    }

    p {
      margin-bottom: 0;
    }

    img {
      max-width: 100%;
      display: block;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: #FFFFFF;
      color: var(--text);
      outline: none;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74,118,168,0.12);
    }

    label {
      display: grid;
      gap: 6px;
      color: #2C4058;
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .app {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: var(--header);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--line);
    }

    .burger {
      display: none;
      width: 44px;
      padding: 0;
      background: #EEF2F6;
      color: #2C4058;
      font-size: 20px;
    }

    .logo {
      margin-right: auto;
      color: #2C4058;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    .notification {
      position: relative;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #EEF2F6;
      font-size: 18px;
    }

    .notification-badge {
      position: absolute;
      right: -2px;
      top: -2px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 10px;
      background: var(--danger);
      color: #FFFFFF;
      font-size: 11px;
      line-height: 18px;
      text-align: center;
      font-weight: 700;
    }

    .top-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      display: grid;
      place-items: center;
      font-weight: 800;
      overflow: hidden;
    }

    .top-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .layout {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      gap: 18px;
    }

    .sidebar {
      position: sticky;
      top: 82px;
      height: calc(100vh - 100px);
      overflow: auto;
      padding: 8px;
      border-radius: var(--radius);
      background: #FFFFFF;
      box-shadow: var(--shadow);
    }

    .nav-item {
      width: 100%;
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 2px 0;
      padding: 0 12px;
      border-radius: 8px;
      background: transparent;
      color: #2C4058;
      text-align: left;
      font-weight: 600;
    }

    .nav-item:hover {
      background: #F2F5F8;
    }

    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
    }

    .nav-item .count {
      margin-left: auto;
      min-width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      padding: 0 6px;
      border-radius: 10px;
      background: var(--danger);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
    }

    .content {
      min-width: 0;
    }

    .page-title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .card {
      min-width: 0;
      padding: 18px;
      border-radius: var(--radius);
      background: #FFFFFF;
      box-shadow: var(--shadow);
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .form {
      display: grid;
      gap: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }

    .profile-card {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 20px;
      align-items: center;
    }

    .big-avatar {
      width: 120px;
      height: 120px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 36px;
      font-weight: 800;
      overflow: hidden;
    }

    .big-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tabs {
      display: flex;
      gap: 18px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
    }

    .tab {
      min-height: 44px;
      padding: 0 2px;
      border-radius: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--muted);
      white-space: nowrap;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 800;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .list-item {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #FFFFFF;
    }

    .checkbox {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #2C4058;
    }

    .checkbox input {
      width: 20px;
      height: 20px;
      min-height: 20px;
      padding: 0;
    }

    .specialist-card {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #FFFFFF;
    }

    .specialist-head {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .small-avatar {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 800;
      overflow: hidden;
    }

    .small-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .price {
      color: var(--accent);
      font-weight: 800;
      font-size: 18px;
    }

    .stars {
      color: var(--warning);
      letter-spacing: 1px;
      font-size: 18px;
    }

    .messages-layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 16px;
      min-height: 600px;
    }

    .dialogs,
    .chat {
      min-width: 0;
      overflow: hidden;
      border-radius: var(--radius);
      background: #FFFFFF;
      box-shadow: var(--shadow);
    }

    .dialog {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .dialog.active {
      background: var(--accent-soft);
    }

    .dialog-avatar {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 800;
      overflow: hidden;
    }

    .dialog-unread {
      min-width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      margin-top: 4px;
      border-radius: 10px;
      background: var(--danger);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
    }

    .chat-header {
      height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      font-weight: 800;
    }

    .back-chat {
      display: none;
      background: #EEF2F6;
      color: #2C4058;
    }

    .chat-body {
      height: 460px;
      overflow: auto;
      padding: 16px;
      display: grid;
      align-content: start;
      gap: 10px;
      background: #FAFBFC;
    }

    .message {
      max-width: 78%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #FFFFFF;
    }

    .message.out {
      justify-self: end;
      border-color: var(--accent);
      background: var(--accent);
      color: #FFFFFF;
    }

    .chat-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--line);
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 15px;
      font-weight: 800;
      font-size: 13px;
    }

    .status.wait {
      background: #FFF6E5;
      color: #A76700;
    }

    .status.done {
      background: #EAF7EE;
      color: var(--success);
    }

    .status.rejected {
      background: #FFECEC;
      color: var(--danger);
    }

    .drawer-overlay,
    .modal-overlay {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(0,0,0,0.38);
      z-index: 80;
    }

    .drawer-overlay.show,
    .modal-overlay.show {
      display: block;
    }

    .modal {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 90;
      display: none;
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      transform: translate(-50%, -50%);
      padding: 20px;
      border-radius: 16px;
      background: #FFFFFF;
      box-shadow: 0 20px 70px rgba(0,0,0,0.25);
    }

    .modal.show {
      display: block;
    }

    .faq-button {
      width: 100%;
      margin-top: 8px;
      background: #EEF2F6;
      color: #2C4058;
      text-align: left;
    }

    .faq-answer {
      display: none;
      padding: 10px 4px 4px;
      color: var(--muted);
    }

    .faq-answer.show {
      display: block;
    }

    .empty {
      padding: 18px;
      border-radius: 12px;
      background: #FFFFFF;
      box-shadow: var(--shadow);
      color: var(--muted);
    }

    @media (max-width: 1199px) {
      :root {
        --sidebar: 200px;
      }

      .layout {
        grid-template-columns: var(--sidebar) minmax(0, 1fr);
      }

      .grid.three {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .messages-layout {
        grid-template-columns: 240px minmax(0, 1fr);
      }
    }

    @media (max-width: 767px) {
      body {
        font-size: 15px;
      }

      .topbar {
        height: 58px;
        padding: 0 12px;
      }

      .burger {
        display: grid;
        place-items: center;
      }

      .logo {
        font-size: 17px;
      }

      .layout {
        display: block;
        padding: 12px;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 100;
        width: 280px;
        max-width: 86vw;
        height: 100vh;
        border-radius: 0;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .grid.two,
      .grid.three,
      .form-row,
      .profile-card {
        grid-template-columns: 1fr;
      }

      .profile-card {
        justify-items: center;
        text-align: center;
      }

      .page-title {
        display: grid;
      }

      .between {
        align-items: flex-start;
        flex-direction: column;
      }

      .row {
        align-items: stretch;
        flex-direction: column;
      }

      .row button,
      .between button,
      .card button,
      .specialist-card button {
        width: 100%;
      }

      .messages-layout {
        display: block;
        min-height: auto;
      }

      .messages-layout.chat-open .dialogs {
        display: none;
      }

      .messages-layout:not(.chat-open) .chat {
        display: none;
      }

      .dialogs,
      .chat {
        min-height: 560px;
      }

      .back-chat {
        display: inline-flex;
        width: auto !important;
      }

      .chat-form {
        grid-template-columns: 1fr;
      }

      .modal {
        width: calc(100vw - 20px);
        max-height: calc(100vh - 20px);
        padding: 16px;
      }

      input,
      select,
      textarea,
      button {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
    function sendToTilda(action, data) {
      window.parent.postMessage(Object.assign({ action: action }, data || {}), '*');
    }

    const USERS_KEY = 'users';
    const CURRENT_USER_KEY = 'currentUser';
    const LOGIN_KEY = 'isLoggedIn';
    const CLIENT_DATA_KEY = 'clientCabinetData';

    const defaultData = {
      section: 'profile',
      historyTab: 'active',
      activeDialog: 0,
      mobileChatOpen: false,
      profile: {
        firstName: '',
        lastName: '',
        email: '',
        phone: '',
        photo: ''
      },
      notifications: {
        requestsEmail: true,
        messagesEmail: true,
        sms: false
      },
      search: {
        q: '',
        specialization: '',
        city: '',
        priceFrom: '',
        priceTo: '',
        rating: '',
        experience: ''
      },
      favorites: [],
      dialogs: [],
      requests: [
        { id: 1, specialistId: 101, specialistName: 'Ирина Иванова', date: '02.06.2026', subject: 'Математика 7 класс', comment: 'Нужны занятия два раза в неделю.', status: 'active' },
        { id: 2, specialistId: 102, specialistName: 'Ольга Смирнова', date: '20.05.2026', subject: 'Английский язык', comment: 'Занятия для ребёнка 9 лет.', status: 'done' },
        { id: 3, specialistId: 103, specialistName: 'Наталья Орлова', date: '11.05.2026', subject: 'Няня на вечер', comment: 'Не подошло расписание.', status: 'rejected' }
      ],
      reviews: [],
      supportMessages: [],
      twoFA: false
    };

    let currentUser = null;
    let data = null;

    const app = document.getElementById('app');

    function safeParse(value, fallback) {
      try {
        return JSON.parse(value) || fallback;
      } catch (e) {
        return fallback;
      }
    }

    function clone(obj) {
      return JSON.parse(JSON.stringify(obj));
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, function(match) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[match];
      });
    }

    function getUsers() {
      return safeParse(localStorage.getItem(USERS_KEY), []);
    }

    function setUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function getInitials(firstName, lastName) {
      const a = (firstName || data.profile.firstName || 'К')[0] || 'К';
      const b = (lastName || data.profile.lastName || 'Л')[0] || 'Л';
      return a + b;
    }

    function saveCurrentUser() {
      if (!currentUser) return;

      currentUser.firstName = data.profile.firstName;
      currentUser.lastName = data.profile.lastName;
      currentUser.email = data.profile.email;
      currentUser.phone = data.profile.phone;
      currentUser.photo = data.profile.photo;
      currentUser.role = 'client';
      currentUser.favorites = data.favorites;

      localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(currentUser));

      const users = getUsers();
      const index = users.findIndex(function(user) {
        return String(user.id) === String(currentUser.id) || user.email === currentUser.email;
      });

      if (index >= 0) {
        users[index] = Object.assign({}, users[index], currentUser);
      } else {
        users.push(currentUser);
      }

      setUsers(users);
    }

    function saveData() {
      localStorage.setItem(CLIENT_DATA_KEY, JSON.stringify(data));
      saveCurrentUser();
      sendResize();
    }

    function checkAccess() {
      if (localStorage.getItem(LOGIN_KEY) !== 'true') {
        sendToTilda('goToLogin');
        app.innerHTML = '<div class="empty">Необходимо войти в аккаунт.</div>';
        return false;
      }

      currentUser = safeParse(localStorage.getItem(CURRENT_USER_KEY), null);

      if (!currentUser) {
        localStorage.setItem(LOGIN_KEY, 'false');
        sendToTilda('goToLogin');
        app.innerHTML = '<div class="empty">Сессия не найдена.</div>';
        return false;
      }

      if (currentUser.role === 'specialist') {
        sendToTilda('goToSpecialistCabinet', { role: 'specialist', userId: currentUser.id });
        sendToTilda('goToCabinet', { role: 'specialist', userId: currentUser.id, page: 'specialist' });
        app.innerHTML = '<div class="empty">Открывается кабинет специалиста.</div>';
        return false;
      }

      return true;
    }

    function loadData() {
      const saved = safeParse(localStorage.getItem(CLIENT_DATA_KEY), null);
      data = Object.assign(clone(defaultData), saved || {});
      data.profile = Object.assign(clone(defaultData.profile), data.profile || {});
      data.notifications = Object.assign(clone(defaultData.notifications), data.notifications || {});
      data.search = Object.assign(clone(defaultData.search), data.search || {});

      data.profile.firstName = currentUser.firstName || data.profile.firstName || 'Анна';
      data.profile.lastName = currentUser.lastName || data.profile.lastName || 'Петрова';
      data.profile.email = currentUser.email || data.profile.email || 'anna@example.ru';
      data.profile.phone = currentUser.phone || data.profile.phone || '+7 900 123-45-67';
      data.profile.photo = currentUser.photo || data.profile.photo || '';
      data.favorites = currentUser.favorites || data.favorites || [];

      if (!data.dialogs.length) {
        data.dialogs = [
          {
            specialistId: 101,
            name: 'Ирина Иванова',
            last: 'Да, свободны вторник и четверг',
            time: '14:20',
            unread: 1,
            messages: [
              { type: 'out', text: 'Здравствуйте! Можно уточнить расписание?' },
              { type: 'in', text: 'Да, свободны вторник и четверг после 17:00.' }
            ]
          }
        ];
      }
    }

    function seedSpecialistsIfNeeded() {
      const users = getUsers();
      const hasSpecialists = users.some(function(user) {
        return user.role === 'specialist';
      });

      if (hasSpecialists) return;

      const sample = [
        {
          id: 101,
          firstName: 'Ирина',
          lastName: 'Иванова',
          email: 'irina@example.ru',
          phone: '+7 900 111-22-33',
          role: 'specialist',
          specialization: 'Репетитор по математике',
          city: 'Москва',
          about: 'Готовлю к ОГЭ и помогаю закрывать пробелы в школьной программе.',
          hourlyPrice: 1200,
          rating: 4.8,
          experience: 8,
          isActive: true,
          photo: ''
        },
        {
          id: 102,

    function filteredSpecialists() {
      const q = String(data.search.q || '').trim().toLowerCase();
      const specialization = data.search.specialization;
      const city = String(data.search.city || '').trim().toLowerCase();
      const priceFrom = Number(data.search.priceFrom || 0);
      const priceTo = Number(data.search.priceTo || 0);
      const ratingFrom = Number(data.search.rating || 0);
      const experienceFrom = Number(data.search.experience || 0);

      return getUsers().filter(function(user) {
        if (user.role !== 'specialist') return false;
        if (user.isActive !== true) return false;

        const name = `${user.firstName || ''} ${user.lastName || ''}`.toLowerCase();
        const spec = String(user.specialization || '').toLowerCase();
        const userCity = String(user.city || '').toLowerCase();
        const price = Number(user.hourlyPrice || user.price || 0);
        const rating = Number(user.rating || 0);
        const exp = Number(user.experience || 0);

        if (q && !(name.includes(q) || spec.includes(q) || userCity.includes(q))) return false;
        if (specialization && user.specialization !== specialization) return false;
        if (city && !userCity.includes(city)) return false;
        if (priceFrom && price < priceFrom) return false;
        if (priceTo && price > priceTo) return false;
        if (ratingFrom && rating < ratingFrom) return false;
        if (experienceFrom && exp < experienceFrom) return false;

        return true;
      });
    }

    function bindSettingsEvents() {
      const photoInput = document.getElementById('photoInput');

      photoInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function() {
          data.profile.photo = reader.result;
          saveData();
          render();
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('saveSettingsBtn').addEventListener('click', function() {
        data.profile.firstName = document.getElementById('firstName').value.trim();
        data.profile.lastName = document.getElementById('lastName').value.trim();
        data.profile.phone = document.getElementById('phone').value.trim();
        data.profile.email = document.getElementById('email').value.trim();

        data.notifications.requestsEmail = document.getElementById('requestsEmail').checked;
        data.notifications.messagesEmail = document.getElementById('messagesEmail').checked;
        data.notifications.sms = document.getElementById('sms').checked;

        const newPassword = document.getElementById('newPassword').value;
        const repeatPassword = document.getElementById('repeatPassword').value;

        if (newPassword || repeatPassword) {
          if (newPassword.length < 6) {
            alert('Новый пароль должен быть не короче 6 символов');
            return;
          }
          if (newPassword !== repeatPassword) {
            alert('Новый пароль и повтор не совпадают');
            return;
          }
          currentUser.password = newPassword;
        }

        saveData();
        alert('Настройки сохранены');
        render();
      });
    }

        data.search.city = document.getElementById('searchCity').value.trim();
        data.search.priceFrom = document.getElementById('priceFrom').value;

          const text = document.querySelector('.review-text[data-id="' + id + '"]').value.trim();
          const request = data.requests.find(function(item) {
            return item.id === id;
          });

          if (!text) {
            alert('Введите текст отзыва');
            return;
          }

          data.reviews.push({
            requestId: id,
            specialistId: request.specialistId,
            specialistName: request.specialistName,
            rating: Number(rating),
            text: text,
            date: new Date().toLocaleDateString('ru-RU')
          });

          saveData();
          render();
        });
      });
    }

    function bindMessagesEvents() {
      document.querySelectorAll('.dialog').forEach(function(dialog) {
        dialog.addEventListener('click', function() {
          data.activeDialog = Number(dialog.dataset.index);
          data.dialogs[data.activeDialog].unread = 0;
          data.mobileChatOpen = true;
          saveData();
          render();
        });
      });

      const back = document.getElementById('backChatBtn');
      if (back) {
        back.addEventListener('click', function() {
          data.mobileChatOpen = false;
          saveData();
          render();
        });
      }

      const input = document.getElementById('chatInput');
      const send = document.getElementById('sendMessageBtn');

      function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        const dialog = data.dialogs[data.activeDialog];
        dialog.messages.push({ type: 'out', text: text });
        dialog.last = text;
        dialog.time = 'сейчас';
        input.value = '';
        saveData();
        render();
      }

      send.addEventListener('click', sendMessage);
      input.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault();
          sendMessage();
        }
      });

      const chatBody = document.getElementById('chatBody');
      if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;
    }

    function bindHistoryEvents() {
      document.querySelectorAll('[data-history-tab]').forEach(function(tab) {
        tab.addEventListener('click', function() {
          data.historyTab = tab.dataset.historyTab;
          saveData();
          render();
        });
      });
    }

    function bindFavoritesEvents() {
      document.querySelectorAll('.remove-favorite').forEach(function(button) {
        button.addEventListener('click', function() {
          const id = String(button.dataset.id);
          data.favorites = data.favorites.filter(function(item) {
            return String(item) !== id;
          });
          saveData();
          render();
        });
      });
    }

    function bindSupportEvents() {
      document.querySelectorAll('.faq-button').forEach(function(button) {
        button.addEventListener('click', function() {
          document.getElementById('faq-' + button.dataset.index).classList.toggle('show');
          sendResize();
        });
      });

      document.getElementById('sendSupportBtn').addEventListener('click', function() {
        const text = document.getElementById('supportMessage').value.trim();

        if (!text) {
          alert('Введите сообщение');
          return;
        }

        data.supportMessages.push({
          text: text,
          date: new Date().toLocaleString('ru-RU')
        });

        saveData();
        alert('Сообщение отправлено');
        render();
      });
    }

    function bindSecurityEvents() {
      document.getElementById('twoFAToggle').addEventListener('change', function(event) {
        data.twoFA = event.target.checked;
        saveData();
        alert('Код отправлен на email');
        render();
      });

      document.getElementById('privacyBtn').addEventListener('click', function() {
        openModal(`
          <h2>Политика конфиденциальности</h2>
          <p>Это текст-заглушка политики конфиденциальности. В реальном сервисе здесь размещаются условия обработки персональных данных, правила хранения информации и контакты оператора.</p>
          <br>
          <button type="button" id="closeModalBtn">Закрыть</button>
        `);
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
      });
    }

    function openDialogWithSpecialist(id) {
      const specialist = getUsers().find(function(user) {
        return String(user.id) === String(id);
      });

      if (!specialist) return;

      const fullName = `${specialist.firstName || ''} ${specialist.lastName || ''}`.trim();
      let index = data.dialogs.findIndex(function(dialog) {
        return String(dialog.specialistId) === String(id);
      });

      if (index < 0) {
        data.dialogs.push({
          specialistId: id,
          name: fullName,
          last: 'Диалог создан',
          time: 'сейчас',
          unread: 0,
          messages: [
            { type: 'out', text: 'Здравствуйте! Хочу уточнить детали занятий.' }
          ]
        });
        index = data.dialogs.length - 1;
      }

      data.activeDialog = index;
      data.mobileChatOpen = true;
      data.section = 'messages';
      saveData();
      render();
    }

    function openLogoutModal() {
      openModal(`
        <h2>Вы уверены?</h2>
        <p class="muted">После выхода потребуется снова войти в аккаунт.</p>
        <br>
        <div class="row">
          <button type="button" class="danger" id="confirmLogoutBtn">Выйти</button>
          <button type="button" class="secondary" id="cancelLogoutBtn">Отмена</button>
        </div>
      `);

      document.getElementById('confirmLogoutBtn').addEventListener('click', function() {
        localStorage.setItem(LOGIN_KEY, 'false');
        localStorage.removeItem(CURRENT_USER_KEY);
        sendToTilda('goToLogin');
      });

      document.getElementById('cancelLogoutBtn').addEventListener('click', closeModal);
    }

    function openModal(html) {
      document.getElementById('modal').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('show');
      document.getElementById('modal').classList.add('show');
      document.body.classList.add('locked');
      document.getElementById('modalOverlay').addEventListener('click', closeModal);
      sendResize();
    }

    function closeModal() {
      const overlay = document.getElementById('modalOverlay');
      const modal = document.getElementById('modal');

      if (overlay) overlay.classList.remove('show');
      if (modal) modal.classList.remove('show');

      document.body.classList.remove('locked');
      sendResize();
    }

    function closeDrawer() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('drawerOverlay');

      if (sidebar) sidebar.classList.remove('open');
      if (overlay) overlay.classList.remove('show');

      document.body.classList.remove('locked');
    }

    function sendResize() {
      setTimeout(function() {
        window.parent.postMessage({
          action: 'resize',
          height: document.body.scrollHeight
        }, '*');
      }, 50);
    }

    function init() {
      if (!checkAccess()) {
        sendResize();
        return;
      }

      seedSpecialistsIfNeeded();
      loadData();
      saveData();
      render();
    }

    window.addEventListener('load', function() {
      window.parent.postMessage({
        action: 'resize',
        height: document.body.scrollHeight
      }, '*');
    });

    const observer = new ResizeObserver(function() {
      sendResize();
    });

    observer.observe(document.body);

    init();
  </script>
</body>
</html>
