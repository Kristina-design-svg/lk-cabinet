<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Специалист — личный кабинет</title>
  <style>
    :root{
      --bg:#F5F5F5;
      --card:#FFFFFF;
      --accent:#5E83AF;
      --accent-soft:#E8F0FA;
      --text:#000000;
      --muted:#818C99;
      --line:#E1E5EB;
      --danger:#E64646;
      --success:#2EA44F;
      --shadow:0 2px 10px rgba(0,0,0,.06);
      --radius:8px;
      --sidebar:220px;
      --header:58px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    body{font-size:14px;line-height:1.45}
    button,input,textarea,select{font:inherit}
    button{min-height:44px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;padding:0 16px}
    button.secondary{background:#EEF2F6;color:#2C4058}
    button.ghost{background:transparent;color:var(--accent)}
    button.danger{background:var(--danger)}
    button.success{background:var(--success)}
    button:active{transform:translateY(1px)}
    a{color:var(--accent);text-decoration:none}
    img{max-width:100%;display:block}
    .app{min-height:100vh}
    .topbar{position:sticky;top:0;z-index:30;height:var(--header);display:flex;align-items:center;gap:14px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
    .burger{display:none;width:44px;padding:0;background:#EEF2F6;color:#000}
    .logo{font-size:19px;font-weight:800;color:#2C4058;margin-right:auto}
    .role-switch{display:flex;gap:4px;padding:3px;background:#EEF2F6;border-radius:10px}
    .role-switch button{min-height:34px;padding:0 12px;background:transparent;color:#2C4058;border-radius:8px}
    .role-switch button.active{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .notify{position:relative;width:42px;height:42px;display:grid;place-items:center;background:#EEF2F6;border-radius:50%;font-size:18px}
    .notify b{position:absolute;right:-2px;top:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:#E64646;color:#fff;font-size:11px;line-height:18px;text-align:center}
    .avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
    .layout{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);gap:16px;max-width:1440px;margin:0 auto;padding:16px}
    .sidebar{position:sticky;top:74px;height:calc(100vh - 90px);overflow:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:8px}
    .nav-item{width:100%;min-height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;margin:2px 0;border-radius:8px;background:transparent;color:#2C4058;text-align:left;font-weight:600}
    .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:800}
    .nav-item .count{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:#E64646;color:#fff;font-size:12px;display:grid;place-items:center}
    .content{min-width:0}
    .page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
    h1{font-size:clamp(22px,3vw,30px);margin:0}
    h2{font-size:20px;margin:0 0 14px}
    h3{font-size:17px;margin:0 0 10px}
    p{margin:0}
    .muted{color:var(--muted)}
    .grid{display:grid;gap:14px}
    .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
    .tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow:auto}
    .tab{min-height:42px;background:transparent;color:var(--muted);padding:0 2px;border-radius:0;border-bottom:3px solid transparent;white-space:nowrap}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:800}
    .form{display:grid;gap:12px}
    label{display:grid;gap:6px;color:#2C4058;font-weight:700}
    input,textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;color:#000}
    textarea{min-height:96px;resize:vertical}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .profile-head{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
    .big-avatar{width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800}
    .list{display:grid;gap:10px}
    .list-item{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}
    .service-card,.person-card{display:grid;gap:10px;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff}
    .toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:#2C4058}
    .toggle input{width:20px;min-height:20px}
    .stars{color:#F5A623;font-size:18px;letter-spacing:1px}
    .messages{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;min-height:570px}
    .dialogs,.chat{background:#fff;border-radius:8px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
    .dialog{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
    .dialog.active{background:var(--accent-soft)}
    .dialog .pic,.person-pic{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
    .chat-head{height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);font-weight:800}
    .back-chat{display:none}
    .chat-body{height:430px;overflow:auto;padding:14px;display:grid;align-content:start;gap:10px;background:#FAFBFC}
    .msg{max-width:78%;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
    .msg.out{justify-self:end;background:var(--accent);color:#fff;border-color:var(--accent)}
    .chat-form{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-top:1px solid var(--line)}
    .modal-backdrop,.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none}
    .modal-backdrop.show,.drawer-overlay.show{display:block}
    .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:90;width:min(560px,calc(100vw - 28px));max-height:90vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.25);padding:18px;display:none}
    .modal.show{display:block}
    .cert-preview{display:flex;gap:10px;flex-wrap:wrap}
    .cert-preview img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
    .faq-q{width:100%;background:#EEF2F6;color:#2C4058;text-align:left;margin-top:8px}
    .faq-a{display:none;padding:10px 4px;color:var(--muted)}
    .faq-a.show{display:block}
    .mobile-only{display:none}
    @media (max-width:1199px){
      :root{--sidebar:180px}
      .layout{grid-template-columns:180px minmax(0,1fr)}
      .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
      .messages{grid-template-columns:220px minmax(0,1fr)}
    }
    @media (max-width:767px){
      .burger{display:grid;place-items:center}
      .topbar{padding:0 10px}
      .logo{font-size:17px}
      .role-switch{order:5;width:100%;margin:0 0 8px}
      .role-switch button{flex:1}
      .topbar{height:auto;min-height:58px;flex-wrap:wrap;padding-bottom:8px}
      .layout{display:block;padding:12px}
      .sidebar{position:fixed;z-index:100;left:0;top:0;width:280px;height:100vh;border-radius:0;transform:translateX(-100%);transition:.2s transform}
      .sidebar.open{transform:translateX(0)}
      .grid.two,.grid.three{grid-template-columns:1fr}
      .page-title{display:grid}
      .profile-head{grid-template-columns:1fr;text-align:center;justify-items:center}
      .messages{display:block;min-height:0}
      .messages.chat-open .dialogs{display:none}
      .messages:not(.chat-open) .chat{display:none}
      .dialogs,.chat{min-height:570px}
      .back-chat{display:inline-flex;background:#EEF2F6;color:#2C4058;margin-right:4px}
      .modal{width:calc(100vw - 18px);height:auto;max-height:calc(100vh - 18px);border-radius:10px}
      .mobile-only{display:inline-flex}
      .button-row{display:grid}
      .button-row button{width:100%}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="burger" id="burger">☰</button>
    <div class="logo">Специалист</div>
    <div class="role-switch">
      <button id="roleSpec">Я специалист</button>
      <button id="roleClient">Я клиент</button>
    </div>
    <div class="notify">🔔<b id="notifyCount">0</b></div>
    <div class="avatar" id="topAvatar">ИИ</div>
  </header>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="modal" id="modal"></div>

<script>
(function(){
  const KEY = "specialist_marketplace_account_v1";

  const specialistMenu = [
    ["profile","👤","Профиль"],["settings","⚙️","Настройки"],["education","🎓","Образование и квалификации"],
    ["experience","💼","Опыт работы"],["services","💰","Услуги и расценки"],["reviews","⭐","Отзывы и рейтинг"],
    ["messages","✉️","Сообщения"],["requests","📋","Заявки от клиентов"],["favorites","❤️","Избранное"],
    ["support","🆘","Поддержка"],["security","🔒","Безопасность"],["logout","🚪","Выход"]
  ];
  const clientMenu = [
    ["profile","👤","Профиль"],["settings","⚙️","Настройки"],["search","🔍","Поиск"],["myReviews","⭐","Мои отзывы"],
    ["messages","✉️","Сообщения"],["history","📋","История заявок"],["favorites","❤️","Избранное"],
    ["support","🆘","Поддержка"],["security","🔒","Безопасность"],["logout","🚪","Выход"]
  ];

  const defaultState = {
    role:"specialist",
    section:"profile",
    mobileChat:false,
    activeDialog:0,
    profile:{firstName:"Ирина",lastName:"Иванова",phone:"+7 900 123-45-67",email:"irina@example.ru",city:"Москва",about:"Репетитор по математике и няня с педагогическим образованием. Работаю спокойно, системно и с понятной обратной связью для родителей."},
    notifications:{requests:true,messages:true,sms:false,smsPhone:"+7 900 123-45-67"},
    education:[
      {place:"МПГУ",speciality:"Педагогическое образование",year:"2017"},
      {place:"Фоксфорд",speciality:"Методика онлайн-обучения",year:"2021"}
    ],
    certificates:[],
    experience:[
      {position:"Репетитор",org:"Частная практика",period:"2018 — сейчас",duties:"Подготовка к ОГЭ, ЕГЭ, помощь с домашними заданиями."},
      {position:"Няня",org:"Семья",period:"2016 — 2018",duties:"Сопровождение, развивающие занятия, режим дня."}
    ],
    recommendations:[
      {from:"Анна Петрова",text:"Ирина быстро нашла подход к ребёнку и помогла подтянуть математику.",date:"12.04.2026"}
    ],
    services:[
      {title:"Математика 5–9 класс",duration:"60 минут",price:1200,active:true},
      {title:"Подготовка к ОГЭ",duration:"90 минут",price:1800,active:true},
      {title:"Няня на вечер",duration:"3 часа",price:3000,active:false}
    ],
    discount:10,
    paid:false,
    reviews:[
      {name:"Марина",rating:5,text:"Очень внимательный специалист. Дочь стала увереннее решать задачи.",answer:""},
      {name:"Олег",rating:5,text:"Понятные объяснения и дисциплина без давления.",answer:""},
      {name:"Екатерина",rating:4,text:"Хороший контакт с ребёнком, будем продолжать.",answer:""}
    ],
    dialogs:[
      {name:"Марина",last:"Спасибо, всё подходит",time:"14:20",unread:2,messages:[
        {from:"in",text:"Здравствуйте! Можно уточнить расписание?"},
        {from:"out",text:"Да, свободны вторник и четверг после 17:00."},
        {from:"in",text:"Спасибо, всё подходит"}
      ]},
      {name:"Алексей",last:"Нужна подготовка к ОГЭ",time:"Вчера",unread:1,messages:[
        {from:"in",text:"Добрый день. Нужна подготовка к ОГЭ."},
        {from:"out",text:"Здравствуйте! Могу предложить пробное занятие."}
      ]}
    ],
    requests:[
      {name:"Марина",service:"Математика 5–9 класс",date:"02.06.2026",status:"active"},
      {name:"Алексей",service:"Подготовка к ОГЭ",date:"05.06.2026",status:"active"},
      {name:"Светлана",service:"Няня на вечер",date:"20.05.2026",status:"done"}
    ],
    specialists:[
      {name:"Ирина Иванова",rating:4.8,subjects:"Математика, ОГЭ",price:1200,type:"Репетитор",exp:8},
      {name:"Ольга Смирнова",rating:4.9,subjects:"Английский, дошкольники",price:1500,type:"Репетитор",exp:6},
      {name:"Наталья Орлова",rating:4.7,subjects:"Няня, развитие",price:1000,type:"Няня",exp:10}
    ],
    favorites:[],
    clientReviews:[],
    supportMessages:[],
    twoFA:false
  };

  let state = load();
  let requestTab = "active";
  let historyTab = "active";

  function load(){
    try { return Object.assign(structuredClone(defaultState), JSON.parse(localStorage.getItem(KEY)||"{}")); }
    catch(e){ return structuredClone(defaultState); }
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); sendHeight(); }
  function esc(s){ return String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m])); }
  function initials(){ return (state.profile.firstName[0]||"И") + (state.profile.lastName[0]||"И"); }
  function menu(){ return state.role==="specialist" ? specialistMenu : clientMenu; }
  function unread(){ return state.dialogs.reduce((a,d)=>a+d.unread,0); }
  function newReq(){ return state.requests.filter(r=>r.status==="active").length; }

  function render(){
    document.getElementById("roleSpec").classList.toggle("active", state.role==="specialist");
    document.getElementById("roleClient").classList.toggle("active", state.role==="client");
    document.getElementById("topAvatar").textContent = initials();
    document.getElementById("notifyCount").textContent = unread()+newReq();
    renderSidebar();
    renderContent();
    save();
  }

  function renderSidebar(){
    const sidebar = document.getElementById("sidebar");
    sidebar.innerHTML = menu().map(([id,icon,label])=>{
      let count = id==="messages" ? unread() : id==="requests" ? newReq() : 0;
      return `<button class="nav-item ${state.section===id?"active":""}" data-section="${id}">
        <span>${icon}</span><span>${label}</span>${count?`<span class="count">${count}</span>`:""}
      </button>`;
    }).join("");
    sidebar.querySelectorAll(".nav-item").forEach(btn=>{
      btn.onclick=()=>{
        const id=btn.dataset.section;
        if(id==="logout"){ openLogout(); return; }
        state.section=id; state.mobileChat=false; closeDrawer(); render();
      };
    });
  }

  function renderContent(){
    const c = document.getElementById("content");
    const title = menu().find(m=>m[0]===state.section)?.[2] || "Профиль";
    if(state.role==="client" && state.section==="search") return c.innerHTML = searchView();
    if(state.role==="client" && state.section==="myReviews") return c.innerHTML = myReviewsView();
    if(state.role==="client" && state.section==="history") return c.innerHTML = historyView();
    if(state.section==="profile") c.innerHTML = profileView(title);
    if(state.section==="settings") c.innerHTML = settingsView();
    if(state.section==="education") c.innerHTML = educationView();
    if(state.section==="experience") c.innerHTML = experienceView();
    if(state.section==="services") c.innerHTML = servicesView();
    if(state.section==="reviews") c.innerHTML = reviewsView();
    if(state.section==="messages") c.innerHTML = messagesView();
    if(state.section==="requests") c.innerHTML = requestsView();
    if(state.section==="favorites") c.innerHTML = favoritesView();
    if(state.section==="support") c.innerHTML = supportView();
    if(state.section==="security") c.innerHTML = securityView();
    bindSection();
  }

  function pageHead(title, extra=""){ return `<div class="page-title"><div><h1>${title}</h1><p class="muted">${extra}</p></div></div>`; }

  function profileView(){
    const p=state.profile;
    return pageHead("Профиль","Основная информация аккаунта") + `
      <div class="card profile-head">
        <div class="big-avatar">${initials()}</div>
        <div class="grid">
          <h2>${esc(p.firstName)} ${esc(p.lastName)}</h2>
          <p><b>Телефон:</b> <a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></p>
          <p><b>Email:</b> <a href="mailto:${esc(p.email)}">${esc(p.email)}</a></p>
          <p><b>Город:</b> ${esc(p.city)}</p>
          <p>${esc(p.about)}</p>
          <div><button id="editProfile">Редактировать</button></div>
        </div>
      </div>`;
  }

  function settingsView(){
    const p=state.profile,n=state.notifications;
    return pageHead("Настройки","Данные сохраняются в localStorage") + `
      <div class="grid two">
        <div class="card">
          <h2>Личные данные</h2>
          <div class="form">
            ${input("firstName","Имя",p.firstName)}${input("lastName","Фамилия",p.lastName)}
            ${input("phone","Телефон",p.phone,"tel")}${input("email","Email",p.email,"email")}
            ${input("city","Город",p.city)}
            <label>О себе<textarea id="about">${esc(p.about)}</textarea></label>
            <button id="saveSettings">Сохранить</button>
          </div>
        </div>
        <div class="card">
          <h2>Пароль и уведомления</h2>
          <div class="form">
            ${input("oldPass","Текущий пароль","","password")}${input("newPass","Новый пароль","","password")}${input("repeatPass","Повторить пароль","","password")}
            <label class="toggle"><input type="checkbox" id="nReq" ${n.requests?"checked":""}> Почта о заявках</label>
            <label class="toggle"><input type="checkbox" id="nMsg" ${n.messages?"checked":""}> Почта о сообщениях</label>
            <label class="toggle"><input type="checkbox" id="nSms" ${n.sms?"checked":""}> СМС</label>
            ${input("smsPhone","Номер для СМС",n.smsPhone,"tel")}
          </div>
        </div>
      </div>`;
  }
  function input(id,label,value,type="text"){ return `<label>${label}<input id="${id}" type="${type}" value="${esc(value)}"></label>`; }

  function educationView(){
    return pageHead("Образование и квалификации","Дипломы, курсы и сертификаты") + `
      <div class="grid two">
        <div class="card"><div class="between"><h2>Образование</h2><button id="addEdu">+ Добавить</button></div>
          <div class="list">${state.education.map((e,i)=>`<div class="list-item"><b>${esc(e.place)}</b><p>${esc(e.speciality)}, ${esc(e.year)}</p><button class="ghost delEdu" data-i="${i}">Удалить</button></div>`).join("")}</div>
        </div>
        <div class="card"><h2>Сертификаты</h2><input id="certFile" type="file" accept="image/*,.pdf" multiple>
          <div class="cert-preview">${state.certificates.map((f,i)=>`<div><img src="${f.data}" alt=""><p class="muted">${esc(f.name)}</p><button class="ghost delCert" data-i="${i}">Удалить</button></div>`).join("")}</div>
        </div>
      </div>`;
  }

  function experienceView(){
    return pageHead("Опыт работы","Практика и рекомендации") + `
      <div class="grid two">
        <div class="card"><div class="between"><h2>Опыт</h2><button id="addExp">+ Добавить</button></div>
          <div class="list">${state.experience.map(e=>`<div class="list-item"><b>${esc(e.position)}</b><p>${esc(e.org)} · ${esc(e.period)}</p><p class="muted">${esc(e.duties)}</p></div>`).join("")}</div>
        </div>
        <div class="card"><div class="between"><h2>Рекомендации</h2><button id="reqRec">Запросить</button></div>
          <div class="list">${state.recommendations.map(r=>`<div class="list-item"><b>${esc(r.from)}</b><p>${esc(r.text)}</p><p class="muted">${esc(r.date)}</p></div>`).join("")}</div>
        </div>
      </div>`;
  }

  function servicesView(){
    const disc=Number(state.discount)||0;
    return pageHead("Услуги и расценки","Управление услугами и оплатой анкеты") + `
      <div class="card between"><div><b>Статус анкеты:</b> ${state.paid?"Оплачена":"Не оплачена"}</div><button id="payBtn">Оплатить доступ</button></div>
      <div class="card row"><label>Скидка (%)<input id="discount" type="number" value="${disc}" min="0" max="90"></label><button id="saveDiscount">Сохранить скидку</button><button id="addService">+ Добавить услугу</button></div>
      <div class="grid three">${state.services.map((s,i)=>{let price=Math.round(s.price*(1-disc/100));return `<div class="service-card"><h3>${esc(s.title)}</h3><p class="muted">${esc(s.duration)}</p><p><b>${price}₽</b> <span class="muted">до скидки ${s.price}₽</span></p><label class="toggle"><input class="serviceToggle" data-i="${i}" type="checkbox" ${s.active?"checked":""}> Активно</label></div>`}).join("")}</div>`;
  }

  function reviewsView(){
    return pageHead("Отзывы и рейтинг","Рейтинг 4.8 на основе отзывов") + `
      <div class="card"><h2>4.8 <span class="stars">★★★★★</span></h2><p class="muted">${state.reviews.length} отзывов</p></div>
      <div class="list">${state.reviews.map((r,i)=>`<div class="card"><div class="between"><b>${esc(r.name)}</b><span class="stars">${"★".repeat(r.rating)}</span></div><p>${esc(r.text)}</p>${r.answer?`<p><b>Ответ:</b> ${esc(r.answer)}</p>`:`<textarea class="replyText" data-i="${i}" placeholder="Ответить"></textarea><button class="replyBtn" data-i="${i}">Ответить</button>`}</div>`).join("")}</div>`;
  }

  function messagesView(){
    const d=state.dialogs[state.activeDialog]||state.dialogs[0];
    return pageHead("Сообщения","Диалоги с клиентами и специалистами") + `
      <div class="messages ${state.mobileChat?"chat-open":""}">
        <div class="dialogs">${state.dialogs.map((d,i)=>`<div class="dialog ${i===state.activeDialog?"active":""}" data-i="${i}">
          <div class="pic">${esc(d.name[0])}</div><div><b>${esc(d.name)}</b><p class="muted">${esc(d.last)}</p></div><div><span class="muted">${esc(d.time)}</span>${d.unread?`<span class="count">${d.unread}</span>`:""}</div>
        </div>`).join("")}</div>
        <div class="chat">
          <div class="chat-head"><button class="back-chat" id="backChat">← Назад</button><span>${esc(d.name)}</span></div>
          <div class="chat-body" id="chatBody">${d.messages.map(m=>`<div class="msg ${m.from==="out"?"out":""}">${esc(m.text)}</div>`).join("")}</div>
          <div class="chat-form"><input id="msgInput" placeholder="Напишите сообщение"><button id="sendMsg">Отправить</button></div>
        </div>
      </div>`;
  }

  function requestsView(){
    const tabs=[["active","Активные"],["done","Завершённые"],["rejected","Отклонённые"]];
    return pageHead("Заявки от клиентов","Принятие и отклонение заявок") + tabsHtml(tabs,requestTab,"reqTab") + `
      <div class="grid two">${state.requests.filter(r=>r.status===requestTab).map((r,i)=>`<div class="card"><h3>${esc(r.name)}</h3><p>${esc(r.service)}</p><p class="muted">${esc(r.date)}</p>${requestTab==="active"?`<div class="row button-row"><button class="success acceptReq" data-name="${esc(r.name)}">✅ Принять</button><button class="danger rejectReq" data-name="${esc(r.name)}">❌ Отклонить</button></div>`:""}</div>`).join("") || `<div class="card">Нет заявок</div>`}</div>`;
  }

  function searchView(){
    return pageHead("Поиск специалистов","Фильтры и карточки специалистов") + `
      <div class="card form">
        <div class="grid three">
          <label>Тип<select id="fType"><option>Любой</option><option>Репетитор</option><option>Няня</option></select></label>
          <label>Предмет<input id="fSubject" placeholder="Математика"></label>
          <label>Опыт от<input id="fExp" type="number" min="0" value="0"></label>
          <label>Цена до<input id="fPrice" type="number" min="0" value="3000"></label>
          <label>Рейтинг от<input id="fRating" type="number" step="0.1" min="0" max="5" value="4.5"></label>
        </div><button id="findBtn">Найти</button>
      </div>
      <div class="grid three">${state.specialists.map((s,i)=>personCard(s,i)).join("")}</div>`;
  }
  function personCard(s,i){ return `<div class="person-card"><div class="row"><div class="person-pic">${esc(s.name[0])}</div><div><h3>${esc(s.name)}</h3><p class="stars">★ ${s.rating}</p></div></div><p>${esc(s.subjects)}</p><p><b>от ${s.price}₽</b></p><button class="favBtn" data-i="${i}">❤️ В избранное</button><button class="writeBtn">Написать</button><button class="requestBtn">Оставить заявку</button></div>`; }

  function myReviewsView(){
    return pageHead("Мои отзывы","Оставьте отзыв специалисту") + `<div class="card form"><label>Оценка<select id="reviewStars"><option>5</option><option>4</option><option>3</option></select></label><label>Текст<textarea id="reviewText"></textarea></label><button id="publishReview">Опубликовать</button></div><div class="list">${state.clientReviews.map(r=>`<div class="card"><span class="stars">${"★".repeat(r.stars)}</span><p>${esc(r.text)}</p></div>`).join("")}</div>`;
  }

  function historyView(){
    const tabs=[["active","Ожидают"],["done","Завершены"],["rejected","Отклонены"]];
    return pageHead("История заявок","Ваши обращения к специалистам") + tabsHtml(tabs,historyTab,"histTab") + `<div class="grid two">${state.requests.filter(r=>r.status===historyTab).map(r=>`<div class="card"><h3>${esc(r.service)}</h3><p>${esc(r.name)}</p><p class="muted">${esc(r.date)}</p></div>`).join("") || `<div class="card">Нет заявок</div>`}</div>`;
  }

  function favoritesView(){
    return pageHead("Избранное","Сохранённые специалисты") + `<div class="grid three">${state.favorites.map((s,i)=>`<div class="person-card"><h3>${esc(s.name)}</h3><p>${esc(s.subjects)}</p><p class="stars">★ ${s.rating}</p><button class="danger remFav" data-i="${i}">Удалить</button></div>`).join("") || `<div class="card">Пока пусто</div>`}</div>`;
  }

  function supportView(){
    const qs=["Как оплатить доступ?","Как изменить услугу?","Как работает рейтинг?","Как пожаловаться на пользователя?","Как удалить аккаунт?"];
    return pageHead("Поддержка","FAQ, контакты и форма связи") + `<div class="grid two"><div class="card"><h2>FAQ</h2>${qs.map((q,i)=>`<button class="faq-q" data-i="${i}">${q}</button><div class="faq-a" id="faq${i}">Ответ поддержки: напишите нам, и мы поможем решить вопрос.</div>`).join("")}</div><div class="card form"><h2>Контакты</h2><p><a href="https://t.me/example">Telegram</a> · <a href="https://wa.me/79000000000">WhatsApp</a></p><label>Сообщение<textarea id="supportText"></textarea></label><button id="sendSupport">Отправить</button></div></div>`;
  }

  function securityView(){
    return pageHead("Безопасность","Настройки защиты аккаунта") + `<div class="card form"><label class="toggle"><input id="twoFA" type="checkbox" ${state.twoFA?"checked":""}> Включить 2FA</label><button id="privacy">Политика конфиденциальности</button><button id="downloadData" class="secondary">Скачать данные</button></div>`;
  }

  function tabsHtml(tabs,active,cls){ return `<div class="tabs">${tabs.map(t=>`<button class="tab ${active===t[0]?"active":""} ${cls}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>`; }

  function bindSection(){
    const $=id=>document.getElementById(id);
    if($("editProfile")) $("editProfile").onclick=()=>{state.section="settings";render()};
    if($("saveSettings")) $("saveSettings").onclick=()=>{["firstName","lastName","phone","email","city","about"].forEach(k=>state.profile[k]=$(k).value); state.notifications={requests:$("nReq").checked,messages:$("nMsg").checked,sms:$("nSms").checked,smsPhone:$("smsPhone").value}; alert("Сохранено"); render();};
    if($("addEdu")) $("addEdu").onclick=()=>{state.education.push({place:"Новое заведение",speciality:"Специальность",year:"2026"});render()};
    document.querySelectorAll(".delEdu").forEach(b=>b.onclick=()=>{state.education.splice(+b.dataset.i,1);render()});
    if($("certFile")) $("certFile").onchange=e=>[...e.target.files].forEach(file=>{const rd=new FileReader();rd.onload=()=>{state.certificates.push({name:file.name,data:rd.result});render()};rd.readAsDataURL(file)});
    document.querySelectorAll(".delCert").forEach(b=>b.onclick=()=>{state.certificates.splice(+b.dataset.i,1);render()});
    if($("addExp")) $("addExp").onclick=()=>{state.experience.push({position:"Новая должность",org:"Организация",period:"2026",duties:"Описание обязанностей"});render()};
    if($("reqRec")) $("reqRec").onclick=()=>{state.recommendations.push({from:"Новый клиент",text:"Рекомендация запрошена. Пример добавлен.",date:new Date().toLocaleDateString("ru-RU")});render()};
    if($("saveDiscount")) $("saveDiscount").onclick=()=>{state.discount=+$("discount").value;render()};
    if($("addService")) $("addService").onclick=()=>{state.services.push({title:"Новая услуга",duration:"60 минут",price:1000,active:true});render()};
    document.querySelectorAll(".serviceToggle").forEach(b=>b.onchange=()=>{state.services[+b.dataset.i].active=b.checked;render()});
    if($("payBtn")) $("payBtn").onclick=openTariffs;
    document.querySelectorAll(".replyBtn").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;state.reviews[i].answer=document.querySelector(`.replyText[data-i="${i}"]`).value;render()});
    document.querySelectorAll(".dialog").forEach(d=>d.onclick=()=>{state.activeDialog=+d.dataset.i;state.dialogs[state.activeDialog].unread=0;state.mobileChat=true;render()});
    if($("backChat")) $("backChat").onclick=()=>{state.mobileChat=false;render()};
    if($("sendMsg")) $("sendMsg").onclick=sendMessage;
    if($("msgInput")) $("msgInput").onkeydown=e=>{if(e.key==="Enter")sendMessage()};
    document.querySelectorAll(".reqTab").forEach(b=>b.onclick=()=>{requestTab=b.dataset.tab;render()});
    document.querySelectorAll(".histTab").forEach(b=>b.onclick=()=>{historyTab=b.dataset.tab;render()});
    document.querySelectorAll(".acceptReq").forEach(b=>b.onclick=()=>{let r=state.requests.find(x=>x.name===b.dataset.name&&x.status==="active"); if(r)r.status="done";render()});
    document.querySelectorAll(".rejectReq").forEach(b=>b.onclick=()=>{let r=state.requests.find(x=>x.name===b.dataset.name&&x.status==="active"); if(r)r.status="rejected";render()});
    document.querySelectorAll(".favBtn").forEach(b=>b.onclick=()=>{state.favorites.push(state.specialists[+b.dataset.i]);render()});
    document.querySelectorAll(".remFav").forEach(b=>b.onclick=()=>{state.favorites.splice(+b.dataset.i,1);render()});
    document.querySelectorAll(".writeBtn").forEach(b=>b.onclick=()=>{state.section="messages";render()});
    document.querySelectorAll(".requestBtn").forEach(b=>b.onclick=()=>{state.requests.push({name:"Вы",service:"Новая заявка",date:new Date().toLocaleDateString("ru-RU"),status:"active"});alert("Заявка отправлена");render()});
    if($("publishReview")) $("publishReview").onclick=()=>{state.clientReviews.push({stars:+$("reviewStars").value,text:$("reviewText").value});render()};
    document.querySelectorAll(".faq-q").forEach(b=>b.onclick=()=>document.getElementById("faq"+b.dataset.i).classList.toggle("show"));
    if($("sendSupport")) $("sendSupport").onclick=()=>{state.supportMessages.push($("supportText").value);alert("Сообщение отправлено");render()};
    if($("twoFA")) $("twoFA").onchange=e=>{state.twoFA=e.target.checked;alert("Код отправлен");render()};
    if($("privacy")) $("privacy").onclick=()=>openModal("<h2>Политика конфиденциальности</h2><p>Мы храним данные локально в браузере в демонстрационных целях. В реальном сервисе данные защищаются и обрабатываются по закону.</p><br><button onclick='closeModal()'>Закрыть</button>");
    if($("downloadData")) $("downloadData").onclick=()=>alert(JSON.stringify(state,null,2));
    sendHeight();
  }

  function sendMessage(){
    const input=document.getElementById("msgInput");
    if(!input.value.trim()) return;
    const d=state.dialogs[state.activeDialog];
    d.messages.push({from:"out",text:input.value.trim()});
    d.last=input.value.trim(); d.time="сейчас";
    render();
  }

  function openTariffs(){
    openModal(`<h2>Тарифы</h2><div class="grid">
      ${[["Базовый","500₽/мес"],["Продвинутый","1000₽/мес"],["Премиум","2000₽/мес"]].map(t=>`<div class="card"><h3>${t[0]}</h3><p>${t[1]}</p><button onclick="payStub()">Перейти к оплате</button></div>`).join("")}
      <button class="secondary" onclick="closeModal()">Закрыть</button></div>`);
  }

  window.payStub=function(){state.paid=true;save();alert("Оплата: заглушка");closeModal();render()};
  window.closeModal=closeModal;

  function openLogout(){
    openModal(`<h2>Выйти из аккаунта?</h2><p class="muted">Будут очищены данные localStorage.</p><br><div class="row"><button class="danger" onclick="confirmLogout()">Выйти</button><button class="secondary" onclick="closeModal()">Отмена</button></div>`);
  }
  window.confirmLogout=function(){localStorage.removeItem(KEY);location.reload()};

  function openModal(html){document.getElementById("modal").innerHTML=html;document.getElementById("modalBackdrop").classList.add("show");document.getElementById("modal").classList.add("show");sendHeight();}
  function closeModal(){document.getElementById("modalBackdrop").classList.remove("show");document.getElementById("modal").classList.remove("show");sendHeight();}
  function openDrawer(){document.getElementById("sidebar").classList.add("open");document.getElementById("drawerOverlay").classList.add("show")}
  function closeDrawer(){document.getElementById("sidebar").classList.remove("open");document.getElementById("drawerOverlay").classList.remove("show")}

  document.getElementById("burger").onclick=openDrawer;
  document.getElementById("drawerOverlay").onclick=closeDrawer;
  document.getElementById("modalBackdrop").onclick=closeModal;
  document.getElementById("roleSpec").onclick=()=>{state.role="specialist";state.section="profile";render()};
  document.getElementById("roleClient").onclick=()=>{state.role="client";state.section="profile";render()};

  function sendHeight(){
    setTimeout(()=>parent.postMessage({type:"resize",height:document.documentElement.scrollHeight},"*"),50);
  }
  window.addEventListener("resize",sendHeight);
  render();
})();
</script>
</body>
</html>
