<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет специалиста</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #F5F5F5; --card: #FFFFFF; --accent: #4A76A8; --accent-dark: #3F6795;
      --accent-soft: #E8F0FA; --text: #000000; --muted: #818C99; --line: #DCE1E6;
      --danger: #E64646; --success: #2EA44F; --warning: #F5A623;
      --shadow: 0 4px 20px rgba(0,0,0,0.08); --radius: 12px; --sidebar: 240px; --header: 64px;
    }
    html, body { margin: 0; min-width: 320px; min-height: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: 'Manrope', Arial, sans-serif; font-size: 15px; line-height: 1.45; }
    body.locked { overflow: hidden; }
    button, input, textarea, select { font-family: 'Manrope', Arial, sans-serif; font-size: 15px; }
    button { min-height: 44px; border: 0; border-radius: 8px; padding: 0 16px; background: var(--accent); color: #FFFFFF; font-weight: 700; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    button.secondary { background: #EEF2F6; color: #2C4058; }
    button.danger { background: var(--danger); }
    a { color: var(--accent); text-decoration: none; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    h3 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 0; }
    input, select, textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #FFFFFF; color: var(--text); outline: none; }
    textarea { min-height: 96px; resize: vertical; }
    label { display: grid; gap: 6px; color: #2C4058; font-weight: 700; }
    .muted { color: var(--muted); }
    .app { min-height: 100vh; }
    .topbar { position: sticky; top: 0; z-index: 40; height: var(--header); display: flex; align-items: center; gap: 14px; padding: 0 20px; background: #FFFFFF; border-bottom: 1px solid var(--line); }
    .burger { display: none; width: 44px; padding: 0; background: #EEF2F6; color: #2C4058; font-size: 20px; }
    .logo { margin-right: auto; color: #2C4058; font-size: 20px; font-weight: 800; cursor: pointer; }
    .layout { max-width: 1480px; margin: 0 auto; padding: 18px; display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); gap: 18px; }
    .sidebar { position: sticky; top: 82px; height: calc(100vh - 100px); overflow: auto; padding: 8px; border-radius: var(--radius); background: #FFFFFF; box-shadow: var(--shadow); }
    .nav-item { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 10px; margin: 2px 0; padding: 0 12px; border-radius: 8px; background: transparent; color: #2C4058; text-align: left; font-weight: 600; }
    .nav-item:hover { background: #F2F5F8; }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 800; }
    .nav-item .count { margin-left: auto; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 6px; border-radius: 10px; background: var(--danger); color: #FFFFFF; font-size: 12px; font-weight: 800; }
    .content { min-width: 0; }
    .page-title { margin-bottom: 16px; }
    .card { padding: 18px; border-radius: var(--radius); background: #FFFFFF; box-shadow: var(--shadow); }
    .grid { display: grid; gap: 16px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .form { display: grid; gap: 14px; }
    .form-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .profile-card { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; align-items: center; }
    .avatar-block { position: relative; width: 120px; height: 120px; }
    .big-avatar { width: 120px; height: 120px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #FFFFFF; font-size: 36px; font-weight: 800; overflow: hidden; }
    .big-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-upload { position: absolute; bottom: 0; right: 0; width: 36px; height: 36px; border-radius: 50%; background: #FFFFFF; border: 2px solid var(--line); display: grid; place-items: center; cursor: pointer; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .avatar-upload input { display: none; }
    .rating { display: inline-flex; align-items: center; gap: 8px; color: var(--warning); font-weight: 800; }
    .status { display: inline-flex; align-items: center; min-height: 30px; padding: 0 10px; border-radius: 15px; font-weight: 800; font-size: 13px; }
    .status.good { background: #EAF7EE; color: var(--success); }
    .status.bad { background: #FFECEC; color: var(--danger); }
    .service-card { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: #FFFFFF; }
    .service-price { font-size: 22px; font-weight: 800; color: var(--accent); }
    .review-summary { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 20px; align-items: center; }
    .big-rating { color: var(--accent); font-size: 48px; font-weight: 800; line-height: 1; }
    .stars { color: var(--warning); letter-spacing: 1px; font-size: 18px; }
    .checkbox { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
    .checkbox input { width: 20px; height: 20px; min-height: 20px; padding: 0; }
    .drawer-overlay, .modal-overlay { position: fixed; inset: 0; display: none; background: rgba(0,0,0,0.38); z-index: 80; }
    .drawer-overlay.show, .modal-overlay.show { display: block; }
    .modal { position: fixed; left: 50%; top: 50%; z-index: 90; display: none; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; transform: translate(-50%, -50%); padding: 20px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 20px 70px rgba(0,0,0,0.25); }
    .modal.show { display: block; }
    .empty { padding: 18px; border-radius: 12px; background: #FFFFFF; box-shadow: var(--shadow); color: var(--muted); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; background: #2C4058; color: #FFFFFF; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @media (max-width: 1199px) { :root { --sidebar: 200px; } .grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 767px) {
      .topbar { height: 58px; padding: 0 12px; }
      .burger { display: grid; place-items: center; }
      .logo { font-size: 17px; }
      .layout { display: block; padding: 12px; }
      .sidebar { position: fixed; left: 0; top: 0; z-index: 100; width: 280px; height: 100vh; border-radius: 0; transform: translateX(-100%); transition: transform 0.2s; }
      .sidebar.open { transform: translateX(0); }
      .grid.two, .grid.three, .form-row, .profile-card, .review-summary { grid-template-columns: 1fr; }
      .profile-card { justify-items: center; text-align: center; }
      .row, .between { flex-direction: column; align-items: stretch; }
      .modal { width: calc(100vw - 20px); max-height: calc(100vh - 20px); padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <div class="toast" id="toast"></div>

  <script>
    var USERS_KEY = 'users', CURRENT_USER_KEY = 'currentUser', LOGIN_KEY = 'isLoggedIn', DATA_KEY = 'specialistCabinetData';

    var defaultData = {
      section: 'profile', requestTab: 'active', activeDialog: 0,
      profile: { firstName: '', lastName: '', email: '', phone: '', city: 'Москва', specialization: '', about: '', hourlyPrice: 1200, photo: '' },
      paid: false,
      services: [{ title: 'Новая услуга', duration: '60 минут', price: 1000, active: true }],
      reviews: [],
      dialogs: [],
      requests: [],
      twoFA: false
    };

    var currentUser = null, data = null;
    var app = document.getElementById('app'), toast = document.getElementById('toast');

    function showToast(text) { toast.textContent = text; toast.classList.add('show'); setTimeout(function() { toast.classList.remove('show'); }, 2500); }
    function safeParse(v, fb) { try { return JSON.parse(v) || fb; } catch(e) { return fb; } }
    function clone(o) { return JSON.parse(JSON.stringify(o)); }
    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]; }); }
    function getInitials() { return ((data.profile.firstName||'С')[0]||'С') + ((data.profile.lastName||'П')[0]||'П'); }
    function getUsers() { return safeParse(localStorage.getItem(USERS_KEY), []); }
    function setUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

    function saveCurrentUser() {
      if (!currentUser) return;
      var p = data.profile;
      currentUser.firstName = p.firstName; currentUser.lastName = p.lastName; currentUser.email = p.email;
      currentUser.phone = p.phone; currentUser.specialization = p.specialization; currentUser.city = p.city;
      currentUser.about = p.about; currentUser.hourlyPrice = p.hourlyPrice; currentUser.photo = p.photo; currentUser.role = 'specialist';
      currentUser.isActive = currentUser.isActive === true;
      currentUser.services = data.services;
      currentUser.rating = Number(averageRating());
      currentUser.reviewsCount = data.reviews.length;
      localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(currentUser));
      var users = getUsers(), idx = users.findIndex(function(u) { return String(u.id)===String(currentUser.id)||u.email===currentUser.email; });
      if (idx>=0) users[idx] = Object.assign({}, users[idx], currentUser); else users.push(currentUser);
      setUsers(users);
    }

    function saveData() { localStorage.setItem(DATA_KEY, JSON.stringify(data)); saveCurrentUser(); sendResize(); }

    function loadData() {
      var saved = safeParse(localStorage.getItem(DATA_KEY), null);
      data = Object.assign(clone(defaultData), saved || {});
      data.profile = Object.assign(clone(defaultData.profile), data.profile || {});
      var p = data.profile;
      p.firstName = currentUser.firstName || p.firstName || 'Специалист';
      p.lastName = currentUser.lastName || p.lastName || '';
      p.email = currentUser.email || p.email || '';
      p.phone = currentUser.phone || p.phone || '';
      p.specialization = currentUser.specialization || p.specialization || '';
      p.city = currentUser.city || p.city || 'Москва';
      p.about = currentUser.about || p.about || '';
      p.hourlyPrice = currentUser.hourlyPrice || p.hourlyPrice || 1200;
      p.photo = currentUser.photo || p.photo || '';
    }

    function checkAccess() {
      if (localStorage.getItem(LOGIN_KEY)==='true') {
        currentUser = safeParse(localStorage.getItem(CURRENT_USER_KEY), null);
        if (currentUser && currentUser.role === 'specialist') return true;
        if (currentUser && currentUser.role === 'client') {
          sendToTilda('goToClientCabinet', { role: 'client', userId: currentUser.id });
          sendToTilda('goToCabinet', { role: 'client', userId: currentUser.id, page: 'client' });
          app.innerHTML = '<div class="empty">Открывается кабинет клиента.</div>';
          sendResize();
          return false;
        }
      }
      var urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('logged')==='true') {
        localStorage.setItem(LOGIN_KEY, 'true');
        currentUser = { id: Date.now(), firstName: urlParams.get('firstName')||'Специалист', lastName: urlParams.get('lastName')||'', email: urlParams.get('email')||'', phone: urlParams.get('phone')||'', role: 'specialist', specialization: urlParams.get('specialization')||'', photo: '' };
        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(currentUser));
        return true;
      }
      app.innerHTML = '<div class="empty" style="text-align:center;padding:60px 20px;"><h2>Необходимо войти в аккаунт</h2><br><button id="goLoginBtn">Войти</button></div>';
      setTimeout(function(){ var btn = document.getElementById('goLoginBtn'); if (btn) btn.addEventListener('click', function(){ sendToTilda('goToLogin'); }); sendToTilda('goToLogin'); }, 0);
      sendResize(); return false;
    }

    function activeRequestsCount() { return data.requests.filter(function(r) { return r.status==='active'; }).length; }
    function averageRating() { if (!data.reviews.length) return '0.0'; return (data.reviews.reduce(function(s,r) { return s+Number(r.rating||0); },0)/data.reviews.length).toFixed(1); }
    function isPublished() { return currentUser && currentUser.isActive === true; }
    function activeServicePrices() {
      return data.services.filter(function(s) { return s.active; }).map(function(s) { return Number(s.price || 0); }).filter(Boolean).sort(function(a,b) { return a-b; });
    }
    function validatePublishProfile() {
      var missing = [];
      if (!data.profile.firstName) missing.push('имя');
      if (!data.profile.phone) missing.push('телефон');
      if (!data.profile.city) missing.push('город');
      if (!data.profile.specialization) missing.push('специализацию');
      if (!data.profile.about) missing.push('описание');
      if (!data.services.some(function(s) { return s.active && s.title && Number(s.price || 0) > 0; })) missing.push('активную услугу с ценой');
      return missing;
    }
    function publishProfile() {
      var missing = validatePublishProfile();
      if (missing.length) {
        showToast('Заполните: ' + missing.join(', '));
        return;
      }

      var prices = activeServicePrices();
      data.profile.hourlyPrice = prices[0] || Number(data.profile.hourlyPrice || 0) || 1000;
      currentUser.isActive = true;
      saveData();
      showToast('Анкета опубликована в каталоге');
      sendToTilda('profilePublished', { id: currentUser.id });
      render();
    }
    function unpublishProfile() {
      currentUser.isActive = false;
      saveData();
      showToast('Анкета снята с публикации');
      sendToTilda('profileUnpublished', { id: currentUser.id });
      render();
    }

    function render() {
      app.innerHTML = '<header class="topbar"><button class="burger" id="burgerBtn">☰</button><div class="logo" id="logoBtn">Кабинет специалиста</div><div class="top-avatar">'+getInitials()+'</div></header>'+
        '<div class="drawer-overlay" id="drawerOverlay"></div><div class="layout"><aside class="sidebar" id="sidebar">'+sidebarHTML()+'</aside><main class="content">'+contentHTML()+'</main></div>'+
        '<div class="modal-overlay" id="modalOverlay"></div><div class="modal" id="modal"></div>';
      bindBaseEvents(); bindSectionEvents(); sendResize();
    }

    function sidebarHTML() {
      return [['profile','👤','Профиль',0],['settings','⚙️','Настройки',0],['services','💰','Услуги и расценки',0],['reviews','⭐','Отзывы и рейтинг',0],['messages','✉️','Сообщения',0],['requests','📋','Заявки',activeRequestsCount()],['support','🆘','Поддержка',0],['security','🔒','Безопасность',0],['logout','🚪','Выйти',0]]
        .map(function(i) { return '<button class="nav-item'+(data.section===i[0]?' active':'')+'" data-section="'+i[0]+'"><span>'+i[1]+'</span><span>'+i[2]+'</span>'+(i[3]?'<span class="count">'+i[3]+'</span>':'')+'</button>'; }).join('');
    }

    function avatarHTML() { return data.profile.photo ? '<img src="'+data.profile.photo+'" alt="Фото">' : getInitials(); }

    function contentHTML() {
      var s = data.section;
      if (s==='profile') return '<div class="page-title"><h1>Профиль</h1></div><div class="card profile-card"><div class="avatar-block"><div class="big-avatar">'+avatarHTML()+'</div><label class="avatar-upload" title="Изменить фото">📷<input id="photoInput" type="file" accept="image/*"></label></div><div class="grid"><h2>'+esc(data.profile.firstName)+' '+esc(data.profile.lastName)+'</h2><p class="muted">'+esc(data.profile.specialization||'Специалист')+' · '+esc(data.profile.city)+'</p><div class="row"><span class="rating">★ '+averageRating()+'</span><span class="muted">'+data.reviews.length+' отзывов</span></div><p>'+esc(data.profile.about||'Информация не указана')+'</p><div class="row"><button id="editProfileBtn">Редактировать</button></div></div></div>';
      if (s==='settings') return '<div class="page-title"><h1>Настройки</h1></div><div class="grid two"><div class="card"><h2>Основные данные</h2><div class="form"><div class="form-row"><label>Имя<input id="firstName" value="'+esc(data.profile.firstName)+'"></label><label>Фамилия<input id="lastName" value="'+esc(data.profile.lastName)+'"></label></div><div class="form-row"><label>Телефон<input id="phone" value="'+esc(data.profile.phone)+'"></label><label>Email<input id="email" value="'+esc(data.profile.email)+'"></label></div><div class="form-row"><label>Город<input id="city" value="'+esc(data.profile.city)+'"></label><label>Специализация<input id="specialization" value="'+esc(data.profile.specialization)+'"></label></div><label>О себе<textarea id="about">'+esc(data.profile.about)+'</textarea></label><button id="saveSettingsBtn">Сохранить изменения</button></div></div><div class="card"><h2>Смена пароля</h2><div class="form"><label>Новый пароль<input id="newPassword" type="password"></label><label>Повторите пароль<input id="repeatPassword" type="password"></label><button id="changePasswordBtn">Сменить пароль</button></div></div></div>';
      if (s==='services') return '<div class="page-title"><h1>Услуги и расценки</h1></div><div class="grid"><div class="card between"><div><h2>Статус доступа</h2><span class="status '+(data.paid?'good':'bad')+'">'+(data.paid?'Анкета активна':'Не оплачена')+'</span></div><button id="payAccessBtn">Оплатить доступ</button></div><div class="card between"><div><h2>Публикация в каталоге</h2><p class="muted">После публикации клиенты увидят вашу карточку в каталоге и публичном профиле.</p><br><span class="status '+(isPublished()?'good':'bad')+'">'+(isPublished()?'Опубликована':'Не опубликована')+'</span></div><div class="row"><button id="publishProfileBtn">'+(isPublished()?'Обновить карточку':'Опубликовать в каталоге')+'</button>'+(isPublished()?'<button class="secondary" id="unpublishProfileBtn">Снять с публикации</button>':'')+'</div></div><div class="card row"><button id="addServiceBtn">+ Добавить услугу</button></div><div class="grid three">'+data.services.map(function(s,i){ return '<div class="service-card"><label>Название<input data-service="'+i+'" data-field="title" value="'+esc(s.title)+'"></label><label>Длительность<input data-service="'+i+'" data-field="duration" value="'+esc(s.duration)+'"></label><label>Цена<input data-service="'+i+'" data-field="price" type="number" value="'+esc(s.price)+'"></label><div class="service-price">'+esc(s.price)+'₽</div><label class="checkbox"><input data-service-toggle="'+i+'" type="checkbox" '+(s.active?'checked':'')+'> Активна</label><button class="secondary remove-service" data-index="'+i+'">Удалить</button></div>'; }).join('')+'</div></div>';
      if (s==='reviews') return '<div class="page-title"><h1>Отзывы и рейтинг</h1></div><div class="card review-summary"><div><div class="big-rating">'+averageRating()+'</div><div class="stars">★★★★★</div></div><div><h2>'+data.reviews.length+' отзывов</h2></div></div>';
      if (s==='support') return '<div class="page-title"><h1>Поддержка</h1></div><div class="card"><p>Свяжитесь с нами: <a href="https://t.me/example">Telegram</a> · <a href="https://wa.me/79000000000">WhatsApp</a></p></div>';
      if (s==='security') return '<div class="page-title"><h1>Безопасность</h1></div><div class="card form"><button id="privacyBtn">Политика конфиденциальности</button><br><button id="logoutBtn" class="danger">Выйти из аккаунта</button></div>';
      return '<div class="page-title"><h1>'+esc(s)+'</h1></div><p class="muted">Раздел в разработке</p>';
    }

    function bindBaseEvents() {
      document.getElementById('logoBtn').addEventListener('click', function(){ sendToTilda('goHome'); });
      document.getElementById('burgerBtn').addEventListener('click', function(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('drawerOverlay').classList.add('show'); });
      document.getElementById('drawerOverlay').addEventListener('click', function(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('show'); });
      document.querySelectorAll('.nav-item').forEach(function(b) { b.addEventListener('click', function(){
        if (b.dataset.section==='logout') { openLogoutModal(); return; }
        data.section = b.dataset.section; saveData(); render();
      });});
    }

    function bindSectionEvents() {
      if (data.section==='profile') {
        var eb = document.getElementById('editProfileBtn'); if (eb) eb.addEventListener('click', function(){ data.section='settings'; saveData(); render(); });
        var pi = document.getElementById('photoInput'); if (pi) pi.addEventListener('change', function(e) {
          var file = e.target.files[0]; if (!file) return;
          var reader = new FileReader();
          reader.onload = function() { data.profile.photo = reader.result; saveData(); showToast('Фотография обновлена'); render(); };
          reader.readAsDataURL(file);
        });
      }
      if (data.section==='settings') {
        var sb = document.getElementById('saveSettingsBtn');
        if (sb) sb.addEventListener('click', function(){
          data.profile.firstName=document.getElementById('firstName').value.trim();
          data.profile.lastName=document.getElementById('lastName').value.trim();
          data.profile.phone=document.getElementById('phone').value.trim();
          data.profile.email=document.getElementById('email').value.trim();
          data.profile.city=document.getElementById('city').value.trim();
          data.profile.specialization=document.getElementById('specialization').value.trim();
          data.profile.about=document.getElementById('about').value.trim();
          saveData(); showToast('Изменения сохранены'); render();
        });
        var pb = document.getElementById('changePasswordBtn');
        if (pb) pb.addEventListener('click', function(){
          var np=document.getElementById('newPassword').value, rp=document.getElementById('repeatPassword').value;
          if (np.length<6) { showToast('Пароль должен быть минимум 6 символов'); return; }
          if (np!==rp) { showToast('Пароли не совпадают'); return; }
          currentUser.password=np; saveData(); showToast('Пароль успешно изменён');
        });
      }
      if (data.section==='services') {
        document.getElementById('addServiceBtn').addEventListener('click', function(){ data.services.push({title:'Новая услуга',duration:'60 минут',price:1000,active:true}); saveData(); render(); });
        var publishBtn = document.getElementById('publishProfileBtn');
        if (publishBtn) publishBtn.addEventListener('click', publishProfile);
        var unpublishBtn = document.getElementById('unpublishProfileBtn');
        if (unpublishBtn) unpublishBtn.addEventListener('click', unpublishProfile);
        document.getElementById('payAccessBtn').addEventListener('click', function(){ openModal('<h2>Оплатить доступ</h2><div class="grid"><div class="card"><h3>Базовый</h3><p>500₽/мес</p><button class="payment-btn">Оплатить</button></div><div class="card"><h3>Продвинутый</h3><p>1000₽/мес</p><button class="payment-btn">Оплатить</button></div><div class="card"><h3>Премиум</h3><p>2000₽/мес</p><button class="payment-btn">Оплатить</button></div><button class="secondary" id="closeModalBtn">Закрыть</button></div>');
          document.querySelectorAll('.payment-btn').forEach(function(b){ b.addEventListener('click',function(){ data.paid=true; saveData(); closeModal(); showToast('Доступ оплачен'); render(); }); });
          document.getElementById('closeModalBtn').addEventListener('click',closeModal);
        });
        document.querySelectorAll('[data-service]').forEach(function(i){ i.addEventListener('input',function(){ data.services[Number(i.dataset.service)][i.dataset.field]=i.dataset.field==='price'?Number(i.value||0):i.value; saveData(); }); });
        document.querySelectorAll('[data-service-toggle]').forEach(function(i){ i.addEventListener('change',function(){ data.services[Number(i.dataset.serviceToggle)].active=i.checked; saveData(); render(); }); });
        document.querySelectorAll('.remove-service').forEach(function(b){ b.addEventListener('click',function(){ data.services.splice(Number(b.dataset.index),1); saveData(); render(); }); });
      }
      if (data.section==='security') {
        var pb = document.getElementById('privacyBtn'); if (pb) pb.addEventListener('click',function(){ openModal('<h2>Политика конфиденциальности</h2><p>Это текст-заглушка политики конфиденциальности.</p><br><button id="closeModalBtn">Закрыть</button>'); document.getElementById('closeModalBtn').addEventListener('click',closeModal); });
        var lb = document.getElementById('logoutBtn'); if (lb) lb.addEventListener('click',openLogoutModal);
      }
      sendResize();
    }

    function openLogoutModal() {
      openModal('<h2>Вы уверены?</h2><p class="muted">После выхода потребуется снова войти.</p><br><div class="row"><button class="danger" id="confirmLogoutBtn">Выйти</button><button class="secondary" id="cancelLogoutBtn">Отмена</button></div>');
      document.getElementById('confirmLogoutBtn').addEventListener('click',function(){ localStorage.setItem(LOGIN_KEY,'false'); localStorage.removeItem(CURRENT_USER_KEY); sendToTilda('goToLogin'); });
      document.getElementById('cancelLogoutBtn').addEventListener('click',closeModal);
    }

    function openModal(html) { document.getElementById('modal').innerHTML=html; document.getElementById('modalOverlay').classList.add('show'); document.getElementById('modal').classList.add('show'); sendResize(); }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); document.getElementById('modal').classList.remove('show'); sendResize(); }
    function sendToTilda(action, data) { window.parent.postMessage(Object.assign({ action: action }, data || {}), '*'); }
    function sendResize() { setTimeout(function(){ window.parent.postMessage({action:'resize',height:document.body.scrollHeight},'*'); },50); }

    function init() { if (!checkAccess()) return; loadData(); saveData(); render(); }
    window.addEventListener('load', function(){ window.parent.postMessage({action:'resize',height:document.body.scrollHeight},'*'); });
    new ResizeObserver(sendResize).observe(document.body);
    init();
  </script>
</body>
</html>
