<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Специалист - каталог репетиторов и нянь</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #F5F5F5;
      --card: #FFFFFF;
      --accent: #4A76A8;
      --accent-dark: #3F6795;
      --accent-soft: #E8F0FA;
      --text: #000000;
      --muted: #818C99;
      --line: #DCE1E6;
      --success: #2EA44F;
      --danger: #E64646;
      --warning: #F5A623;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --radius: 12px;
      --sidebar: 248px;
    }
    html, body { margin: 0; min-width: 320px; min-height: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font: 15px/1.45 Arial, sans-serif; }
    body.locked { overflow: hidden; }
    button, input, select, textarea { font: inherit; }
    button { min-height: 44px; border: 0; border-radius: 8px; padding: 0 16px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; transition: .15s ease; }
    button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    button.secondary { background: #EEF2F6; color: #2C4058; }
    button.danger { background: var(--danger); }
    button.success { background: var(--success); }
    button.ghost { background: transparent; color: var(--accent); min-height: 32px; padding: 0; }
    input, select, textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; color: var(--text); outline: none; }
    textarea { min-height: 96px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,118,168,.12); }
    label { display: grid; gap: 6px; color: #2C4058; font-weight: 700; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: clamp(24px, 3vw, 34px); line-height: 1.15; }
    h2 { margin-bottom: 14px; font-size: 20px; }
    h3 { margin-bottom: 8px; font-size: 17px; }
    p { margin-bottom: 0; }
    a { color: var(--accent); text-decoration: none; }
    .muted { color: var(--muted); }
    .app { min-height: 100vh; }
    .topbar { position: sticky; top: 0; z-index: 40; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: #fff; border-bottom: 1px solid var(--line); }
    .burger { display: grid; place-items: center; width: 44px; padding: 0; background: #EEF2F6; color: #2C4058; font-size: 20px; }
    .brand { margin-right: auto; color: #2C4058; font-size: 20px; font-weight: 800; cursor: pointer; }
    .user-chip { display: none; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 20px; background: #EEF2F6; color: #2C4058; font-weight: 700; }
    .layout { width: min(100%, 1480px); margin: 0 auto; padding: 14px; display: grid; grid-template-columns: 1fr; gap: 14px; }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 100; width: min(86vw, 292px); padding: 10px; overflow: auto; background: #fff; box-shadow: var(--shadow); transform: translateX(-105%); transition: transform .2s ease; }
    .sidebar.open { transform: translateX(0); }
    .overlay { position: fixed; inset: 0; z-index: 90; display: none; background: rgba(0,0,0,.38); }
    .overlay.show { display: block; }
    .nav-title { padding: 12px; color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .nav-btn { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 10px; margin: 2px 0; padding: 0 12px; border-radius: 8px; background: transparent; color: #2C4058; text-align: left; font-weight: 700; }
    .nav-btn:hover { background: #F2F5F8; transform: none; }
    .nav-btn.active { background: var(--accent-soft); color: var(--accent); }
    .content { min-width: 0; }
    .page-head { display: grid; gap: 10px; margin-bottom: 14px; }
    .card { min-width: 0; padding: 16px; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
    .grid { display: grid; gap: 14px; }
    .grid.two, .grid.three { grid-template-columns: 1fr; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .between { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .form { display: grid; gap: 12px; }
    .form-row { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .tabs { display: flex; gap: 12px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
    .tab { min-height: 44px; border-radius: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); white-space: nowrap; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .pill { display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 800; }
    .status { display: inline-flex; min-height: 28px; align-items: center; padding: 0 10px; border-radius: 14px; font-size: 13px; font-weight: 800; }
    .status.draft { background: #EEF2F6; color: #2C4058; }
    .status.review { background: #FFF6E5; color: #A76700; }
    .status.published { background: #EAF7EE; color: var(--success); }
    .status.hidden { background: #FFECEC; color: var(--danger); }
    .avatar { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px; font-weight: 800; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-card { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 14px; align-items: center; }
    .catalog-shell { display: grid; gap: 14px; }
    .filters { display: none; }
    .filters.open { display: block; }
    .filter-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .check-list { display: grid; gap: 8px; }
    .check-item { display: flex; gap: 8px; align-items: flex-start; color: #2C4058; font-weight: 600; }
    .check-item input { width: 18px; height: 18px; min-height: 18px; margin-top: 2px; padding: 0; }
    .specialist-card { display: grid; gap: 12px; padding: 16px; border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); }
    .specialist-top { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 12px; align-items: center; }
    .card-meta { display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
    .price { color: #2C4058; font-size: 20px; font-weight: 800; }
    .rating { color: var(--warning); font-weight: 800; }
    .card-actions { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .empty { padding: 28px 16px; border-radius: var(--radius); background: #fff; box-shadow: var(--shadow); text-align: center; color: var(--muted); }
    .pagination { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .page-btn { min-width: 44px; background: #EEF2F6; color: #2C4058; }
    .page-btn.active { background: var(--accent); color: #fff; }
    .modal { position: fixed; inset: auto 10px 10px; z-index: 120; display: none; max-height: 88vh; overflow: auto; padding: 16px; border-radius: 16px; background: #fff; box-shadow: 0 20px 70px rgba(0,0,0,.25); }
    .modal.show { display: block; }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 200; display: none; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 12px 16px; border-radius: 10px; background: #2C4058; color: #fff; font-weight: 700; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
    .toast.show { display: block; }
    .message-list { display: grid; gap: 10px; }
    .message-item, .request-item { padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .auth-wrap { min-height: calc(100vh - 64px); display: grid; place-items: center; padding: 18px; }
    .auth-card { width: min(100%, 430px); }
    @media (min-width: 768px) {
      .layout { padding: 18px; grid-template-columns: var(--sidebar) minmax(0,1fr); gap: 18px; }
      .burger { display: none; }
      .sidebar { position: sticky; top: 82px; width: auto; height: calc(100vh - 100px); transform: none; border-radius: var(--radius); }
      .user-chip { display: inline-flex; }
      .grid.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .grid.three { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .form-row { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .catalog-shell { grid-template-columns: 280px minmax(0,1fr); }
      .filters { display: block; position: sticky; top: 82px; align-self: start; }
      .mobile-filter { display: none; }
      .card-actions { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .modal { left: 50%; top: 50%; right: auto; bottom: auto; width: min(720px, calc(100vw - 36px)); transform: translate(-50%, -50%); }
    }
    @media (min-width: 1280px) {
      .grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast"></div>

  <script>
    const DB = {
      users: 'mp_users',
      profiles: 'mp_profiles',
      requests: 'mp_requests',
      messages: 'mp_messages',
      currentUser: 'mp_current_user'
    };

    const filters = {
      tutorSubjects: ['Логопед','Обучение чтению','Подготовка к школе','Математика','Русский язык','Физика','Химия','Биология','Информатика','Английский язык','Немецкий язык','Французский язык','Другие языки','Литература','История','Музыка','Искусство'],
      educationLevels: ['Дошкольное образование','Начальная школа','Средняя школа','Высшее образование'],
      experienceLevels: ['Начинающий','Средний','Опытный'],
      lessonFormats: ['Индивидуальные','Групповые','Онлайн','Очные'],
      tutorSkills: ['Подготовка к ЕГЭ','Подготовка к ОГЭ','Подготовка к олимпиадам','Методика Монтессори','Собственные методики'],
      teachingLanguages: ['Русский','Английский','Другие языки'],
      childAges: ['Новорожденные','До 1 года','От 1 до 3 лет','От 3 до 6 лет','От 6 лет'],
      employmentTypes: ['Полный день','Частичная занятость','Временная работа','С проживанием','Автоняня'],
      nannySkills: ['Педагогическое образование','Психологическое образование','Первая помощь','Иностранные языки','Работа с детьми с особенностями развития'],
      careMethods: ['Игровые методики','Развивающие занятия'],
      extraServices: ['Приготовление пищи','Уборка после детей','Помощь с уроками'],
      weekdays: ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],
      workConditions: ['Работа с несколькими детьми','Наличие домашних животных'],
      territories: ['На территории специалиста','На территории клиента']
    };

    const state = {
      route: 'catalog',
      cabinetSection: 'profile',
      catalogType: 'all',
      page: 1,
      perPage: 9,
      editingProfileId: null,
      search: {
        q: '', type: 'all', city: '', district: '', priceMin: '', priceMax: '',
        ratingMin: '', reviewsMin: '', experienceLevel: '', sort: 'rating',
        subject: '', educationLevel: '', lessonFormat: '', tutorSkill: '', language: '',
        childAge: '', employmentType: '', nannySkill: '', careMethod: '', extraService: '',
        weekday: '', territory: '', homeVisit: '', homeWork: '', multipleChildren: '', pets: ''
      }
    };

    const app = document.getElementById('app');
    const toast = document.getElementById('toast');

    function read(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch(e) { return fallback; } }
    function write(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
    function esc(v) { return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
    function id() { return Date.now() + Math.floor(Math.random() * 1000); }
    function showToast(text) { toast.textContent = text; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2200); }
    function sendToTilda(action, data = {}) { window.parent.postMessage({ action, ...data }, '*'); }
    function resize() { setTimeout(() => sendToTilda('resize', { height: document.body.scrollHeight }), 50); }
    function currentUser() { return read(DB.currentUser, null); }
    function setCurrentUser(user) { write(DB.currentUser, user); }
    function users() { return read(DB.users, []); }
    function profiles() { return read(DB.profiles, []); }
    function saveProfiles(items) { write(DB.profiles, items); }
    function initials(item) { return ((item.firstName || 'С')[0] || 'С') + ((item.lastName || 'П')[0] || 'П'); }
    function roleTitle(role) { return role === 'tutor' ? 'Репетитор' : role === 'nanny' ? 'Няня' : 'Клиент'; }
    function statusText(status) { return ({ draft:'Черновик', review:'На модерации', published:'Опубликована', hidden:'Скрыта' })[status] || status; }

    function seed() {
      if (localStorage.getItem('mp_seeded_v2')) return;
      const demoUsers = [
        { id: 101, role: 'tutor', firstName: 'Ирина', lastName: 'Иванова', email: 'tutor@example.ru', password: '123456', phone: '+79001112233' },
        { id: 102, role: 'nanny', firstName: 'Наталья', lastName: 'Орлова', email: 'nanny@example.ru', password: '123456', phone: '+79004445566' },
        { id: 103, role: 'client', firstName: 'Анна', lastName: 'Петрова', email: 'client@example.ru', password: '123456', phone: '+79007778899' }
      ];
      const demoProfiles = [
        {
          id: 201, userId: 101, type: 'tutor', status: 'published', views: 128, responses: 17,
          firstName: 'Ирина', lastName: 'Иванова', city: 'Москва', district: 'Хамовники',
          photo: '', rating: 4.9, reviewsCount: 42, experienceYears: 8, experienceLevel: 'Опытный',
          price: 1600, about: 'Готовлю к ОГЭ и ЕГЭ, закрываю пробелы по математике, работаю спокойно и системно.',
          keywords: 'математика огэ егэ школьная программа алгебра геометрия',
          subjects: ['Математика','Подготовка к школе'], educationLevels: ['Средняя школа'], lessonFormats: ['Индивидуальные','Онлайн','Очные'],
          tutorSkills: ['Подготовка к ЕГЭ','Подготовка к ОГЭ'], teachingLanguages: ['Русский'],
          childAges: [], employmentTypes: [], nannySkills: [], careMethods: [], extraServices: [],
          weekdays: ['Пн','Ср','Пт'], timeFrom: '10:00', timeTo: '20:00', homeVisit: true, homeWork: false,
          workConditions: ['Наличие домашних животных'], territories: ['На территории клиента']
        },
        {
          id: 202, userId: 102, type: 'nanny', status: 'published', views: 96, responses: 21,
          firstName: 'Наталья', lastName: 'Орлова', city: 'Москва', district: 'Сокол',
          photo: '', rating: 4.8, reviewsCount: 31, experienceYears: 10, experienceLevel: 'Опытный',
          price: 1200, about: 'Няня с педагогическим образованием. Режим дня, прогулки, развивающие занятия, спокойная коммуникация.',
          keywords: 'няня прогулки режим развивающие занятия педагогика',
          subjects: [], educationLevels: [], lessonFormats: [], tutorSkills: [], teachingLanguages: ['Русский'],
          childAges: ['От 1 до 3 лет','От 3 до 6 лет'], employmentTypes: ['Частичная занятость','Автоняня'],
          nannySkills: ['Педагогическое образование','Первая помощь'], careMethods: ['Игровые методики','Развивающие занятия'],
          extraServices: ['Приготовление пищи','Помощь с уроками'], weekdays: ['Пн','Вт','Чт'], timeFrom: '09:00', timeTo: '18:00',
          homeVisit: false, homeWork: true, workConditions: ['Работа с несколькими детьми'], territories: ['На территории специалиста','На территории клиента']
        }
      ];
      write(DB.users, demoUsers);
      write(DB.profiles, demoProfiles);
      write(DB.requests, []);
      write(DB.messages, []);
      localStorage.setItem('mp_seeded_v2', 'true');
    }

    function renderShell(content) {
      const user = currentUser();
      app.innerHTML = `
        <header class="topbar">
          <button class="burger" id="burgerBtn" type="button">☰</button>
          <div class="brand" id="homeBtn">Специалист</div>
          <div class="user-chip">${user ? esc(user.firstName) + ' · ' + roleTitle(user.role) : 'Гость'}</div>
          ${user ? '<button class="secondary" id="logoutTopBtn" type="button">Выйти</button>' : '<button id="loginTopBtn" type="button">Войти</button>'}
        </header>
        <div class="overlay" id="overlay"></div>
        <div class="layout">
          <aside class="sidebar" id="sidebar">${navHTML()}</aside>
          <main class="content">${content}</main>
        </div>
        <div class="overlay" id="modalOverlay"></div>
        <div class="modal" id="modal"></div>`;
      bindShell();
      resize();
    }

    function navHTML() {
      const user = currentUser();
      const base = [
        ['catalog','🔎','Каталог'],
        ['auth','👤', user ? 'Профиль' : 'Вход'],
      ];
      const cabinet = user ? [
        ['cabinet','🏠','Личный кабинет'],
        ['messages','✉️','Сообщения'],
        ['requests','📋','Заявки'],
        ['settings','⚙️','Настройки']
      ] : [];
      return `<div class="nav-title">Навигация</div>${base.concat(cabinet).map(i => `<button class="nav-btn ${state.route === i[0] ? 'active' : ''}" data-route="${i[0]}" type="button"><span>${i[1]}</span><span>${i[2]}</span></button>`).join('')}`;
    }

    function bindShell() {
      document.getElementById('burgerBtn').onclick = () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); document.body.classList.add('locked'); };
      document.getElementById('overlay').onclick = closeDrawer;
      document.getElementById('homeBtn').onclick = () => setRoute('catalog');
      const login = document.getElementById('loginTopBtn');
      if (login) login.onclick = () => setRoute('auth');
      const logout = document.getElementById('logoutTopBtn');
      if (logout) logout.onclick = doLogout;
      document.querySelectorAll('[data-route]').forEach(btn => btn.onclick = () => { setRoute(btn.dataset.route); closeDrawer(); });
    }
    function closeDrawer() { document.getElementById('sidebar')?.classList.remove('open'); document.getElementById('overlay')?.classList.remove('show'); document.body.classList.remove('locked'); }
    function setRoute(route) { state.route = route; state.page = 1; render(); }

    function render() {
      seed();
      if (state.route === 'auth') return renderAuth();
      if (state.route === 'cabinet') return renderCabinet();
      if (state.route === 'messages') return renderMessages();
      if (state.route === 'requests') return renderRequests();
      if (state.route === 'settings') return renderSettings();
      return renderCatalog();
    }

    function renderAuth() {
      const user = currentUser();
      if (user) return renderCabinet();
      renderShell(`
        <div class="auth-wrap">
          <section class="card auth-card">
            <div class="tabs">
              <button class="tab active" id="loginTab" type="button">Вход</button>
              <button class="tab" id="registerTab" type="button">Регистрация</button>
            </div>
            <div id="authBox"></div>
          </section>
        </div>`);
      showLogin();
      document.getElementById('loginTab').onclick = showLogin;
      document.getElementById('registerTab').onclick = showRegister;
    }

    function setAuthTab(type) {
      document.getElementById('loginTab').classList.toggle('active', type === 'login');
      document.getElementById('registerTab').classList.toggle('active', type === 'register');
    }
    function showLogin() {
      setAuthTab('login');
      document.getElementById('authBox').innerHTML = `
        <div class="form">
          <label>Email<input id="loginEmail" type="email" value="client@example.ru"></label>
          <label>Пароль<input id="loginPassword" type="password" value="123456"></label>
          <button id="loginBtn" type="button">Войти</button>
        </div>`;
      document.getElementById('loginBtn').onclick = () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const user = users().find(u => u.email === email && u.password === password);
        if (!user) return showToast('Неверный email или пароль');
        setCurrentUser(user);
        state.route = user.role === 'client' ? 'catalog' : 'cabinet';
        render();
      };
    }
    function showRegister() {
      setAuthTab('register');
      document.getElementById('authBox').innerHTML = `
        <div class="form">
          <div class="form-row"><label>Имя<input id="regFirst"></label><label>Фамилия<input id="regLast"></label></div>
          <div class="form-row"><label>Email<input id="regEmail" type="email"></label><label>Телефон<input id="regPhone" type="tel"></label></div>
          <div class="form-row"><label>Пароль<input id="regPassword" type="password"></label><label>Тип аккаунта<select id="regRole"><option value="tutor">Репетитор</option><option value="nanny">Няня</option><option value="client">Клиент</option></select></label></div>
          <button id="registerBtn" type="button">Создать аккаунт</button>
        </div>`;
      document.getElementById('registerBtn').onclick = () => {
        const user = {
          id: id(), role: document.getElementById('regRole').value,
          firstName: document.getElementById('regFirst').value.trim(),
          lastName: document.getElementById('regLast').value.trim(),
          email: document.getElementById('regEmail').value.trim(),
          phone: document.getElementById('regPhone').value.trim(),
          password: document.getElementById('regPassword').value
        };
        if (!user.firstName || !user.lastName || !user.email || !user.phone || user.password.length < 6) return showToast('Заполните все поля, пароль минимум 6 символов');
        if (users().some(u => u.email === user.email)) return showToast('Email уже зарегистрирован');
        write(DB.users, users().concat(user));
        setCurrentUser(user);
        state.route = user.role === 'client' ? 'catalog' : 'cabinet';
        render();
      };
    }

    function renderCabinet() {
      const user = currentUser();
      if (!user) { state.route = 'auth'; return renderAuth(); }
      if (user.role === 'client') return renderClientCabinet(user);
      const ownProfiles = profiles().filter(p => String(p.userId) === String(user.id));
      const active = ownProfiles[0];
      renderShell(`
        <div class="page-head">
          <h1>Личный кабинет ${roleTitle(user.role).toLowerCase()}</h1>
          <p class="muted">Создайте анкету, отслеживайте статус, просмотры и отклики.</p>
        </div>
        <div class="grid two">
          <section class="card profile-card">
            <div class="avatar">${initials(user)}</div>
            <div><h2>${esc(user.firstName)} ${esc(user.lastName)}</h2><p class="muted">${roleTitle(user.role)}</p><p>${esc(user.email)} · ${esc(user.phone)}</p></div>
          </section>
          <section class="card">
            <div class="between">
              <div><h2>Анкета</h2><p class="muted">${active ? 'Управляйте публикацией в каталоге.' : 'Анкета еще не создана.'}</p></div>
              <button id="createProfileBtn" type="button">${active ? 'Редактировать анкету' : 'Разместить анкету'}</button>
            </div>
          </section>
        </div>
        <br>
        ${active ? profileManagerHTML(active) : '<div class="empty">Нажмите «Разместить анкету», заполните поля, и анкета появится в каталоге.</div>'}`);
      document.getElementById('createProfileBtn').onclick = () => openProfileForm(active || null);
      bindProfileActions();
    }

    function renderClientCabinet(user) {
      renderShell(`
        <div class="page-head"><h1>Личный кабинет клиента</h1><p class="muted">Избранные специалисты, заявки и сообщения.</p></div>
        <section class="card profile-card"><div class="avatar">${initials(user)}</div><div><h2>${esc(user.firstName)} ${esc(user.lastName)}</h2><p>${esc(user.email)} · ${esc(user.phone)}</p></div></section>
        <br><div class="grid two">
          <section class="card"><h2>Быстрый поиск</h2><p class="muted">Откройте каталог и примените фильтры для репетиторов или нянь.</p><br><button id="goCatalogBtn">Открыть каталог</button></section>
          <section class="card"><h2>Избранное</h2><div class="message-list">${favoriteProfiles().length ? favoriteProfiles().map(p => `<div class="message-item">${cardMini(p)}</div>`).join('') : '<p class="muted">Пока пусто.</p>'}</div></section>
        </div>`);
      document.getElementById('goCatalogBtn').onclick = () => setRoute('catalog');
    }

    function profileManagerHTML(profile) {
      return `
        <section class="card">
          <div class="between">
            <div>
              <h2>${esc(profile.firstName)} ${esc(profile.lastName)}</h2>
              <p class="muted">${roleTitle(profile.type)} · ${esc(profile.city)} · ${esc(profile.district)}</p>
            </div>
            <span class="status ${profile.status}">${statusText(profile.status)}</span>
          </div>
          <br>
          <div class="grid three">
            <div><b>${profile.views || 0}</b><p class="muted">просмотров</p></div>
            <div><b>${profile.responses || 0}</b><p class="muted">откликов</p></div>
            <div><b>${profile.price} ₽/час</b><p class="muted">стоимость</p></div>
          </div>
          <br>
          <div class="row">
            <button data-action="publish" data-id="${profile.id}" class="success">Опубликовать</button>
            <button data-action="hide" data-id="${profile.id}" class="secondary">Скрыть</button>
            <button data-action="edit" data-id="${profile.id}">Редактировать</button>
            <button data-action="delete" data-id="${profile.id}" class="danger">Удалить</button>
          </div>
        </section>`;
    }

    function bindProfileActions() {
      document.querySelectorAll('[data-action]').forEach(btn => btn.onclick = () => {
        const profile = profiles().find(p => String(p.id) === String(btn.dataset.id));
        if (!profile) return;
        if (btn.dataset.action === 'edit') return openProfileForm(profile);
        if (btn.dataset.action === 'delete') {
          saveProfiles(profiles().filter(p => String(p.id) !== String(profile.id)));
          showToast('Анкета удалена');
          return render();
        }
        profile.status = btn.dataset.action === 'publish' ? 'published' : 'hidden';
        saveProfile(profile);
        showToast(profile.status === 'published' ? 'Анкета опубликована в каталоге' : 'Анкета скрыта');
        render();
      });
    }

    function openProfileForm(profile) {
      const user = currentUser();
      const type = user.role;
      const p = profile || {
        id: id(), userId: user.id, type, status: 'draft', views: 0, responses: 0,
        firstName: user.firstName, lastName: user.lastName, city: '', district: '', photo: '',
        rating: 0, reviewsCount: 0, experienceYears: 0, experienceLevel: 'Начинающий', price: 1000,
        about: '', keywords: '', subjects: [], educationLevels: [], lessonFormats: [], tutorSkills: [], teachingLanguages: [],
        childAges: [], employmentTypes: [], nannySkills: [], careMethods: [], extraServices: [],
        weekdays: [], timeFrom: '09:00', timeTo: '18:00', homeVisit: false, homeWork: false, workConditions: [], territories: []
      };
      openModal(`
        <h2>${profile ? 'Редактировать анкету' : 'Разместить анкету'}</h2>
        <div class="form" id="profileForm">
          <div class="form-row"><label>Имя<input id="pfFirst" value="${esc(p.firstName)}"></label><label>Фамилия<input id="pfLast" value="${esc(p.lastName)}"></label></div>
          <div class="form-row"><label>Город<input id="pfCity" value="${esc(p.city)}"></label><label>Район<input id="pfDistrict" value="${esc(p.district)}"></label></div>
          <div class="form-row"><label>Опыт, лет<input id="pfExpYears" type="number" min="0" value="${esc(p.experienceYears)}"></label><label>Уровень опыта<select id="pfExpLevel">${options(filters.experienceLevels, p.experienceLevel)}</select></label></div>
          <div class="form-row"><label>Стоимость ₽/час<input id="pfPrice" type="number" min="0" value="${esc(p.price)}"></label><label>Фото<input id="pfPhoto" type="file" accept="image/*"></label></div>
          <label>Описание<textarea id="pfAbout">${esc(p.about)}</textarea></label>
          <label>Ключевые слова<input id="pfKeywords" value="${esc(p.keywords)}" placeholder="математика, няня, развитие, экзамены"></label>
          ${type === 'tutor' ? tutorFields(p) : nannyFields(p)}
          ${commonFields(p)}
          <div class="row"><button id="saveDraftBtn" type="button" class="secondary">Сохранить черновик</button><button id="sendReviewBtn" type="button">Сохранить и опубликовать</button><button id="closeModalBtn" type="button" class="secondary">Закрыть</button></div>
        </div>`);
      document.getElementById('closeModalBtn').onclick = closeModal;
      document.getElementById('pfPhoto').onchange = event => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => { p.photo = reader.result; };
        reader.readAsDataURL(file);
      };
      document.getElementById('saveDraftBtn').onclick = () => saveProfileFromForm(p, 'draft');
      document.getElementById('sendReviewBtn').onclick = () => saveProfileFromForm(p, 'published');
    }

    function options(items, selected) { return items.map(i => `<option value="${esc(i)}" ${i === selected ? 'selected' : ''}>${esc(i)}</option>`).join(''); }
    function checks(name, items, selected = []) { return `<div class="check-list">${items.map(i => `<label class="check-item"><input type="checkbox" name="${name}" value="${esc(i)}" ${selected.includes(i) ? 'checked' : ''}>${esc(i)}</label>`).join('')}</div>`; }
    function tutorFields(p) {
      return `<section class="card"><h3>Поля репетитора</h3><div class="filter-grid">
        <label>Предметы${checks('subjects', filters.tutorSubjects, p.subjects)}</label>
        <label>Уровень образования${checks('educationLevels', filters.educationLevels, p.educationLevels)}</label>
        <label>Формат занятий${checks('lessonFormats', filters.lessonFormats, p.lessonFormats)}</label>
        <label>Дополнительные навыки${checks('tutorSkills', filters.tutorSkills, p.tutorSkills)}</label>
        <label>Язык преподавания${checks('teachingLanguages', filters.teachingLanguages, p.teachingLanguages)}</label>
      </div></section>`;
    }
    function nannyFields(p) {
      return `<section class="card"><h3>Поля няни</h3><div class="filter-grid">
        <label>Возраст детей${checks('childAges', filters.childAges, p.childAges)}</label>
        <label>Тип занятости${checks('employmentTypes', filters.employmentTypes, p.employmentTypes)}</label>
        <label>Навыки и квалификации${checks('nannySkills', filters.nannySkills, p.nannySkills)}</label>
        <label>Методы ухода${checks('careMethods', filters.careMethods, p.careMethods)}</label>
        <label>Дополнительные услуги${checks('extraServices', filters.extraServices, p.extraServices)}</label>
      </div></section>`;
    }
    function commonFields(p) {
      return `<section class="card"><h3>Общие условия</h3><div class="form-row"><label>Дни недели${checks('weekdays', filters.weekdays, p.weekdays)}</label><label>Территория${checks('territories', filters.territories, p.territories)}</label></div>
        <div class="form-row"><label>Начало работы<input id="pfTimeFrom" type="time" value="${esc(p.timeFrom)}"></label><label>Конец работы<input id="pfTimeTo" type="time" value="${esc(p.timeTo)}"></label></div>
        <label>Условия работы${checks('workConditions', filters.workConditions, p.workConditions)}</label>
        <div class="row"><label class="check-item"><input id="pfHomeVisit" type="checkbox" ${p.homeVisit ? 'checked' : ''}>Выезд на дом</label><label class="check-item"><input id="pfHomeWork" type="checkbox" ${p.homeWork ? 'checked' : ''}>Работа на дому</label></div></section>`;
    }

    function selectedChecks(name) { return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(i => i.value); }
    function saveProfileFromForm(p, status) {
      Object.assign(p, {
        firstName: document.getElementById('pfFirst').value.trim(),
        lastName: document.getElementById('pfLast').value.trim(),
        city: document.getElementById('pfCity').value.trim(),
        district: document.getElementById('pfDistrict').value.trim(),
        experienceYears: Number(document.getElementById('pfExpYears').value || 0),
        experienceLevel: document.getElementById('pfExpLevel').value,
        price: Number(document.getElementById('pfPrice').value || 0),
        about: document.getElementById('pfAbout').value.trim(),
        keywords: document.getElementById('pfKeywords').value.trim(),
        status,
        subjects: selectedChecks('subjects'), educationLevels: selectedChecks('educationLevels'), lessonFormats: selectedChecks('lessonFormats'),
        tutorSkills: selectedChecks('tutorSkills'), teachingLanguages: selectedChecks('teachingLanguages'), childAges: selectedChecks('childAges'),
        employmentTypes: selectedChecks('employmentTypes'), nannySkills: selectedChecks('nannySkills'), careMethods: selectedChecks('careMethods'),
        extraServices: selectedChecks('extraServices'), weekdays: selectedChecks('weekdays'), territories: selectedChecks('territories'),
        workConditions: selectedChecks('workConditions'), timeFrom: document.getElementById('pfTimeFrom').value, timeTo: document.getElementById('pfTimeTo').value,
        homeVisit: document.getElementById('pfHomeVisit').checked, homeWork: document.getElementById('pfHomeWork').checked
      });
      if (!p.firstName || !p.city || !p.about || !p.price) return showToast('Заполните имя, город, описание и стоимость');
      saveProfile(p);
      closeModal();
      showToast(status === 'published' ? 'Анкета опубликована' : 'Черновик сохранен');
      render();
    }
    function saveProfile(profile) {
      const list = profiles();
      const index = list.findIndex(p => String(p.id) === String(profile.id));
      if (index >= 0) list[index] = profile; else list.push(profile);
      saveProfiles(list);
    }

    function renderCatalog() {
      const items = filteredProfiles();
      const pages = Math.max(1, Math.ceil(items.length / state.perPage));
      if (state.page > pages) state.page = pages;
      const pageItems = items.slice((state.page - 1) * state.perPage, state.page * state.perPage);
      renderShell(`
        <div class="page-head">
          <h1>Каталог специалистов</h1>
          <p class="muted">Поиск по имени, услуге, предмету, городу и ключевым словам. Фильтры для нянь и репетиторов меняются автоматически.</p>
        </div>
        <section class="card">
          <div class="form-row">
            <label>Поиск<input id="searchQ" value="${esc(state.search.q)}" placeholder="Например: математика, няня, Москва, ОГЭ"></label>
            <label>Тип специалиста<select id="typeFilter"><option value="all">Все</option><option value="tutor" ${state.search.type === 'tutor' ? 'selected' : ''}>Репетиторы</option><option value="nanny" ${state.search.type === 'nanny' ? 'selected' : ''}>Няни</option></select></label>
          </div>
          <br><button id="mobileFilterBtn" class="mobile-filter secondary" type="button">⚙️ Фильтры</button>
        </section>
        <div class="catalog-shell">
          <aside class="filters card" id="filtersPanel">${filtersHTML()}</aside>
          <section>
            <div class="between"><b>Найдено ${items.length}</b><label style="max-width:260px">Сортировка<select id="sortFilter">${sortOptions()}</select></label></div>
            <br>
            <div class="grid three">${pageItems.length ? pageItems.map(cardHTML).join('') : '<div class="empty">Специалисты не найдены. Измените фильтры или поисковый запрос.</div>'}</div>
            <div class="pagination">${Array.from({length: pages}, (_, i) => `<button class="page-btn ${state.page === i + 1 ? 'active' : ''}" data-page="${i + 1}" type="button">${i + 1}</button>`).join('')}</div>
          </section>
        </div>`);
      bindCatalog();
    }

    function filtersHTML() {
      const s = state.search;
      const type = s.type;
      const tutor = type !== 'nanny';
      const nanny = type !== 'tutor';
      return `
        <div class="between"><h2>Фильтры</h2><button id="closeFiltersBtn" class="secondary mobile-filter" type="button">Закрыть</button></div>
        <div class="filter-grid">
          <label>Город<input data-filter="city" value="${esc(s.city)}"></label>
          <label>Район<input data-filter="district" value="${esc(s.district)}"></label>
          <div class="form-row"><label>Цена от<input data-filter="priceMin" type="number" value="${esc(s.priceMin)}"></label><label>Цена до<input data-filter="priceMax" type="number" value="${esc(s.priceMax)}"></label></div>
          <div class="form-row"><label>Рейтинг от<input data-filter="ratingMin" type="number" step="0.1" value="${esc(s.ratingMin)}"></label><label>Отзывы от<input data-filter="reviewsMin" type="number" value="${esc(s.reviewsMin)}"></label></div>
          <label>Опыт<select data-filter="experienceLevel"><option value="">Любой</option>${options(filters.experienceLevels, s.experienceLevel)}</select></label>
          ${tutor ? `<label>Предмет<select data-filter="subject"><option value="">Любой</option>${options(filters.tutorSubjects, s.subject)}</select></label>
          <label>Уровень образования<select data-filter="educationLevel"><option value="">Любой</option>${options(filters.educationLevels, s.educationLevel)}</select></label>
          <label>Формат занятий<select data-filter="lessonFormat"><option value="">Любой</option>${options(filters.lessonFormats, s.lessonFormat)}</select></label>
          <label>Навык<select data-filter="tutorSkill"><option value="">Любой</option>${options(filters.tutorSkills, s.tutorSkill)}</select></label>
          <label>Язык<select data-filter="language"><option value="">Любой</option>${options(filters.teachingLanguages, s.language)}</select></label>` : ''}
          ${nanny ? `<label>Возраст детей<select data-filter="childAge"><option value="">Любой</option>${options(filters.childAges, s.childAge)}</select></label>
          <label>Тип занятости<select data-filter="employmentType"><option value="">Любой</option>${options(filters.employmentTypes, s.employmentType)}</select></label>
          <label>Навык няни<select data-filter="nannySkill"><option value="">Любой</option>${options(filters.nannySkills, s.nannySkill)}</select></label>
          <label>Метод ухода<select data-filter="careMethod"><option value="">Любой</option>${options(filters.careMethods, s.careMethod)}</select></label>
          <label>Доп. услуга<select data-filter="extraService"><option value="">Любая</option>${options(filters.extraServices, s.extraService)}</select></label>` : ''}
          <label>День недели<select data-filter="weekday"><option value="">Любой</option>${options(filters.weekdays, s.weekday)}</select></label>
          <label>Территория<select data-filter="territory"><option value="">Любая</option>${options(filters.territories, s.territory)}</select></label>
          <label>Выезд / дом<select data-filter="homeVisit"><option value="">Не важно</option><option value="yes" ${s.homeVisit === 'yes' ? 'selected' : ''}>Выезд на дом</option></select></label>
          <button id="resetFiltersBtn" class="secondary" type="button">Сбросить фильтры</button>
        </div>`;
    }
    function sortOptions() {
      return [['rating','По рейтингу'],['priceAsc','Сначала дешевле'],['priceDesc','Сначала дороже'],['reviews','По отзывам'],['responses','По откликам']].map(([v,t]) => `<option value="${v}" ${state.search.sort === v ? 'selected' : ''}>${t}</option>`).join('');
    }

    function filteredProfiles() {
      const s = state.search;
      const q = s.q.trim().toLowerCase();
      let items = profiles().filter(p => p.status === 'published');
      items = items.filter(p => {
        if (s.type !== 'all' && p.type !== s.type) return false;
        const hay = [p.firstName, p.lastName, p.city, p.district, p.about, p.keywords, ...(p.subjects || []), ...(p.extraServices || []), ...(p.nannySkills || []), ...(p.tutorSkills || [])].join(' ').toLowerCase();
        if (q && !hay.includes(q)) return false;
        if (s.city && !String(p.city).toLowerCase().includes(s.city.toLowerCase())) return false;
        if (s.district && !String(p.district).toLowerCase().includes(s.district.toLowerCase())) return false;
        if (s.priceMin && Number(p.price) < Number(s.priceMin)) return false;
        if (s.priceMax && Number(p.price) > Number(s.priceMax)) return false;
        if (s.ratingMin && Number(p.rating || 0) < Number(s.ratingMin)) return false;
        if (s.reviewsMin && Number(p.reviewsCount || 0) < Number(s.reviewsMin)) return false;
        if (s.experienceLevel && p.experienceLevel !== s.experienceLevel) return false;
        if (s.subject && !(p.subjects || []).includes(s.subject)) return false;
        if (s.educationLevel && !(p.educationLevels || []).includes(s.educationLevel)) return false;
        if (s.lessonFormat && !(p.lessonFormats || []).includes(s.lessonFormat)) return false;
        if (s.tutorSkill && !(p.tutorSkills || []).includes(s.tutorSkill)) return false;
        if (s.language && !(p.teachingLanguages || []).includes(s.language)) return false;
        if (s.childAge && !(p.childAges || []).includes(s.childAge)) return false;
        if (s.employmentType && !(p.employmentTypes || []).includes(s.employmentType)) return false;
        if (s.nannySkill && !(p.nannySkills || []).includes(s.nannySkill)) return false;
        if (s.careMethod && !(p.careMethods || []).includes(s.careMethod)) return false;
        if (s.extraService && !(p.extraServices || []).includes(s.extraService)) return false;
        if (s.weekday && !(p.weekdays || []).includes(s.weekday)) return false;
        if (s.territory && !(p.territories || []).includes(s.territory)) return false;
        if (s.homeVisit === 'yes' && !p.homeVisit) return false;
        return true;
      });
      items.sort((a,b) => {
        if (s.sort === 'priceAsc') return Number(a.price) - Number(b.price);
        if (s.sort === 'priceDesc') return Number(b.price) - Number(a.price);
        if (s.sort === 'reviews') return Number(b.reviewsCount || 0) - Number(a.reviewsCount || 0);
        if (s.sort === 'responses') return Number(b.responses || 0) - Number(a.responses || 0);
        return Number(b.rating || 0) - Number(a.rating || 0);
      });
      return items;
    }

    function cardHTML(p) {
      return `<article class="specialist-card">
        <div class="specialist-top"><div class="avatar">${p.photo ? `<img src="${p.photo}" alt="">` : initials(p)}</div><div><h3>${esc(p.firstName)} ${esc(p.lastName)}</h3><span class="pill">${roleTitle(p.type)}</span></div></div>
        <div class="card-meta"><span>📍 ${esc(p.city)}${p.district ? ', ' + esc(p.district) : ''}</span><span class="rating">★ ${esc(p.rating || '0.0')}</span><span>${esc(p.reviewsCount || 0)} отзывов</span></div>
        <div class="card-meta"><span>${esc(p.experienceLevel)}</span><span>${esc(p.experienceYears)} лет опыта</span></div>
        <div class="price">${esc(p.price)} ₽/час</div>
        <p>${esc(String(p.about || '').slice(0, 150))}${String(p.about || '').length > 150 ? '...' : ''}</p>
        <div class="row">${(p.subjects || p.childAges || []).slice(0, 3).map(x => `<span class="pill">${esc(x)}</span>`).join('')}</div>
        <div class="card-actions"><button data-write="${p.id}" type="button">Написать</button><button data-request="${p.id}" class="secondary" type="button">Оставить заявку</button><button data-favorite="${p.id}" class="secondary" type="button">В избранное</button></div>
      </article>`;
    }
    function cardMini(p) { return `<b>${esc(p.firstName)} ${esc(p.lastName)}</b><p class="muted">${roleTitle(p.type)} · ${esc(p.city)} · ${esc(p.price)} ₽/час</p>`; }
    function favoriteProfiles() {
      const user = currentUser();
      const fav = user?.favorites || [];
      return profiles().filter(p => fav.map(String).includes(String(p.id)));
    }

    function bindCatalog() {
      const searchQ = document.getElementById('searchQ');
      searchQ.oninput = () => { state.search.q = searchQ.value; state.page = 1; renderCatalog(); };
      document.getElementById('typeFilter').onchange = e => { state.search.type = e.target.value; state.page = 1; renderCatalog(); };
      document.getElementById('sortFilter').onchange = e => { state.search.sort = e.target.value; renderCatalog(); };
      document.querySelectorAll('[data-filter]').forEach(el => el.oninput = el.onchange = () => { state.search[el.dataset.filter] = el.value; state.page = 1; renderCatalog(); });
      document.getElementById('resetFiltersBtn').onclick = () => { Object.keys(state.search).forEach(k => state.search[k] = k === 'type' ? 'all' : k === 'sort' ? 'rating' : ''); state.page = 1; renderCatalog(); };
      document.querySelectorAll('[data-page]').forEach(btn => btn.onclick = () => { state.page = Number(btn.dataset.page); renderCatalog(); window.scrollTo({top:0, behavior:'smooth'}); });
      document.querySelectorAll('[data-favorite]').forEach(btn => btn.onclick = () => addFavorite(btn.dataset.favorite));
      document.querySelectorAll('[data-write]').forEach(btn => btn.onclick = () => sendMessage(btn.dataset.write));
      document.querySelectorAll('[data-request]').forEach(btn => btn.onclick = () => makeRequest(btn.dataset.request));
      const mobileFilterBtn = document.getElementById('mobileFilterBtn');
      mobileFilterBtn.onclick = () => document.getElementById('filtersPanel').classList.toggle('open');
      const close = document.getElementById('closeFiltersBtn');
      if (close) close.onclick = () => document.getElementById('filtersPanel').classList.remove('open');
    }

    function requireLogin() {
      if (currentUser()) return true;
      showToast('Войдите или зарегистрируйтесь');
      state.route = 'auth';
      setTimeout(render, 700);
      return false;
    }
    function addFavorite(profileId) {
      if (!requireLogin()) return;
      const user = currentUser();
      user.favorites = user.favorites || [];
      if (!user.favorites.map(String).includes(String(profileId))) user.favorites.push(profileId);
      setCurrentUser(user);
      write(DB.users, users().map(u => String(u.id) === String(user.id) ? user : u));
      showToast('Добавлено в избранное');
    }
    function sendMessage(profileId) {
      if (!requireLogin()) return;
      const profile = profiles().find(p => String(p.id) === String(profileId));
      const list = read(DB.messages, []);
      list.push({ id: id(), profileId, userId: currentUser().id, text: 'Здравствуйте! Хочу уточнить детали сотрудничества.', createdAt: new Date().toISOString() });
      write(DB.messages, list);
      profile.responses = Number(profile.responses || 0) + 1;
      saveProfile(profile);
      showToast('Сообщение отправлено');
    }
    function makeRequest(profileId) {
      if (!requireLogin()) return;
      const profile = profiles().find(p => String(p.id) === String(profileId));
      const list = read(DB.requests, []);
      list.push({ id: id(), profileId, specialistUserId: profile.userId, clientId: currentUser().id, status: 'new', text: 'Новая заявка из каталога', createdAt: new Date().toISOString() });
      write(DB.requests, list);
      profile.responses = Number(profile.responses || 0) + 1;
      saveProfile(profile);
      showToast('Заявка отправлена');
    }

    function renderMessages() {
      if (!requireLogin()) return;
      const user = currentUser();
      const list = read(DB.messages, []).filter(m => String(m.userId) === String(user.id) || profiles().some(p => String(p.id) === String(m.profileId) && String(p.userId) === String(user.id)));
      renderShell(`<div class="page-head"><h1>Сообщения</h1><p class="muted">Все переписки по специалистам и клиентам.</p></div><section class="card message-list">${list.length ? list.map(m => `<div class="message-item"><b>${new Date(m.createdAt).toLocaleString('ru-RU')}</b><p>${esc(m.text)}</p></div>`).join('') : '<p class="muted">Сообщений пока нет.</p>'}</section>`);
    }
    function renderRequests() {
      if (!requireLogin()) return;
      const user = currentUser();
      const list = read(DB.requests, []).filter(r => String(r.clientId) === String(user.id) || String(r.specialistUserId) === String(user.id));
      renderShell(`<div class="page-head"><h1>Заявки</h1><p class="muted">Новые, принятые и завершенные обращения.</p></div><section class="card message-list">${list.length ? list.map(r => `<div class="request-item between"><div><b>Заявка #${r.id}</b><p>${esc(r.text)}</p><p class="muted">${new Date(r.createdAt).toLocaleString('ru-RU')}</p></div><span class="status review">${esc(r.status)}</span></div>`).join('') : '<p class="muted">Заявок пока нет.</p>'}</section>`);
    }
    function renderSettings() {
      if (!requireLogin()) return;
      const user = currentUser();
      renderShell(`<div class="page-head"><h1>Настройки профиля</h1></div><section class="card form"><div class="form-row"><label>Имя<input id="setFirst" value="${esc(user.firstName)}"></label><label>Фамилия<input id="setLast" value="${esc(user.lastName)}"></label></div><div class="form-row"><label>Email<input id="setEmail" value="${esc(user.email)}"></label><label>Телефон<input id="setPhone" value="${esc(user.phone)}"></label></div><button id="saveSettingsBtn">Сохранить</button></section>`);
      document.getElementById('saveSettingsBtn').onclick = () => {
        user.firstName = document.getElementById('setFirst').value.trim();
        user.lastName = document.getElementById('setLast').value.trim();
        user.email = document.getElementById('setEmail').value.trim();
        user.phone = document.getElementById('setPhone').value.trim();
        setCurrentUser(user);
        write(DB.users, users().map(u => String(u.id) === String(user.id) ? user : u));
        showToast('Настройки сохранены');
        render();
      };
    }

    function openModal(html) {
      document.getElementById('modal').innerHTML = html;
      document.getElementById('modalOverlay').classList.add('show');
      document.getElementById('modal').classList.add('show');
      document.body.classList.add('locked');
      document.getElementById('modalOverlay').onclick = closeModal;
      resize();
    }
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
      document.getElementById('modal').classList.remove('show');
      document.body.classList.remove('locked');
      resize();
    }
    function doLogout() {
      localStorage.removeItem(DB.currentUser);
      state.route = 'catalog';
      showToast('Вы вышли из аккаунта');
      render();
    }

    window.addEventListener('load', resize);
    new ResizeObserver(resize).observe(document.body);
    render();
  </script>
</body>
</html>
