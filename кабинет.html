<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Специалист — личный кабинет</title>
  <style>
    :root{
      --bg:#F5F5F5;--card:#FFFFFF;--accent:#5E83AF;--accent-soft:#E8F0FA;
      --text:#000000;--muted:#818C99;--line:#E1E5EB;--danger:#E64646;
      --success:#2EA44F;--shadow:0 2px 10px rgba(0,0,0,.06);
      --radius:8px;--sidebar:220px;--header:58px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    body{font-size:14px;line-height:1.45}
    button,input,textarea,select{font:inherit}
    button{min-height:44px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;padding:0 16px}
    button.secondary{background:#EEF2F6;color:#2C4058}
    button.ghost{background:transparent;color:var(--accent)}
    button.danger{background:var(--danger)}
    button.success{background:var(--success)}
    button:active{transform:translateY(1px)}
    a{color:var(--accent);text-decoration:none;cursor:pointer}
    img{max-width:100%;display:block}
    h1{font-size:clamp(22px,3vw,30px);margin:0}
    h2{font-size:20px;margin:0 0 14px}
    h3{font-size:17px;margin:0 0 10px}
    p{margin:0}
    .muted{color:var(--muted)}
    .hidden{display:none!important}

    .auth-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}
    .auth-wrap{width:min(400px,100%)}
    .auth-logo{text-align:center;font-size:26px;font-weight:800;color:#2C4058;margin-bottom:18px}
    .auth-card{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:22px}
    .auth-card h1{text-align:center;margin-bottom:18px}
    .form{display:grid;gap:12px}
    label{display:grid;gap:6px;color:#2C4058;font-weight:700}
    input,textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;color:#000}
    textarea{min-height:96px;resize:vertical}
    .check-label{display:flex;align-items:flex-start;gap:8px;font-weight:600;color:#2C4058}
    .check-label input{width:18px;min-height:18px;margin-top:2px;flex:0 0 auto}
    .field-error{display:block;min-height:16px;color:var(--danger);font-size:12px;font-weight:400}
    .auth-error{color:var(--danger);font-weight:700;text-align:center;min-height:20px}
    .auth-link{text-align:center;margin-top:12px}
    .role-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .role-choice label{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .role-choice input{width:auto;min-height:auto}

    .app{min-height:100vh}
    .topbar{position:sticky;top:0;z-index:30;height:var(--header);display:flex;align-items:center;gap:14px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
    .burger{display:none;width:44px;padding:0;background:#EEF2F6;color:#000}
    .logo{font-size:19px;font-weight:800;color:#2C4058;margin-right:auto}
    .role-switch{display:flex;gap:4px;padding:3px;background:#EEF2F6;border-radius:10px}
    .role-switch button{min-height:34px;padding:0 12px;background:transparent;color:#2C4058;border-radius:8px}
    .role-switch button.active{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
    .notify{position:relative;width:42px;height:42px;display:grid;place-items:center;background:#EEF2F6;border-radius:50%;font-size:18px}
    .notify b{position:absolute;right:-2px;top:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:#E64646;color:#fff;font-size:11px;line-height:18px;text-align:center}
    .avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
    .layout{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);gap:16px;max-width:1440px;margin:0 auto;padding:16px}
    .sidebar{position:sticky;top:74px;height:calc(100vh - 90px);overflow:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:8px}
    .nav-item{width:100%;min-height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;margin:2px 0;border-radius:8px;background:transparent;color:#2C4058;text-align:left;font-weight:600}
    .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:800}
    .nav-item .count,.dialog .count{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:#E64646;color:#fff;font-size:12px;display:grid;place-items:center}
    .content{min-width:0}
    .page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
    .grid{display:grid;gap:14px}
    .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
    .tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow:auto}
    .tab{min-height:42px;background:transparent;color:var(--muted);padding:0 2px;border-radius:0;border-bottom:3px solid transparent;white-space:nowrap}
    .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:800}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .profile-head{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
    .big-avatar{width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800}
    .list{display:grid;gap:10px}
    .list-item{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}
    .service-card,.person-card{display:grid;gap:10px;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff}
    .toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:#2C4058}
    .toggle input{width:20px;min-height:20px}
    .stars{color:#F5A623;font-size:18px;letter-spacing:1px}
    .messages{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;min-height:570px}
    .dialogs,.chat{background:#fff;border-radius:8px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
    .dialog{display:grid;grid-template-columns:42px 1fr auto;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
    .dialog.active{background:var(--accent-soft)}
    .dialog .pic,.person-pic{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
    .chat-head{height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);font-weight:800}
    .back-chat{display:none}
    .chat-body{height:430px;overflow:auto;padding:14px;display:grid;align-content:start;gap:10px;background:#FAFBFC}
    .msg{max-width:78%;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}
    .msg.out{justify-self:end;background:var(--accent);color:#fff;border-color:var(--accent)}
    .chat-form{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-top:1px solid var(--line)}
    .modal-backdrop,.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none}
    .modal-backdrop.show,.drawer-overlay.show{display:block}
    .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:90;width:min(560px,calc(100vw - 28px));max-height:90vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.25);padding:18px;display:none}
    .modal.show{display:block}
    .cert-preview{display:flex;gap:10px;flex-wrap:wrap}
    .cert-preview img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
    .faq-q{width:100%;background:#EEF2F6;color:#2C4058;text-align:left;margin-top:8px}
    .faq-a{display:none;padding:10px 4px;color:var(--muted)}
    .faq-a.show{display:block}
    @media (max-width:1199px){
      :root{--sidebar:180px}
      .layout{grid-template-columns:180px minmax(0,1fr)}
      .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
      .messages{grid-template-columns:220px minmax(0,1fr)}
    }
    @media (max-width:767px){
      .auth-card{padding:18px}
      .burger{display:grid;place-items:center}
      .topbar{height:auto;min-height:58px;flex-wrap:wrap;padding:0 10px 8px}
      .logo{font-size:17px}
      .role-switch{order:5;width:100%}
      .role-switch button{flex:1}
      .layout{display:block;padding:12px}
      .sidebar{position:fixed;z-index:100;left:0;top:0;width:280px;height:100vh;border-radius:0;transform:translateX(-100%);transition:.2s transform}
      .sidebar.open{transform:translateX(0)}
      .grid.two,.grid.three{grid-template-columns:1fr}
      .page-title{display:grid}
      .profile-head{grid-template-columns:1fr;text-align:center;justify-items:center}
      .messages{display:block;min-height:0}
      .messages.chat-open .dialogs{display:none}
      .messages:not(.chat-open) .chat{display:none}
      .dialogs,.chat{min-height:570px}
      .back-chat{display:inline-flex;background:#EEF2F6;color:#2C4058;margin-right:4px}
      .modal{width:calc(100vw - 18px);max-height:calc(100vh - 18px);border-radius:10px}
      .button-row{display:grid}.button-row button{width:100%}
    }
  </style>
</head>
<body>
<div id="root"></div>
<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="modal" id="modal"></div>

<script>
(function(){
  const APP_KEY="specialist_marketplace_account_v2";
  const USERS_KEY="users";
  const CURRENT_KEY="currentUser";
  const LOGIN_KEY="isLoggedIn";

  const specialistMenu=[
    ["profile","👤","Профиль"],["settings","⚙️","Настройки"],["education","🎓","Образование и квалификации"],
    ["experience","💼","Опыт работы"],["services","💰","Услуги и расценки"],["reviews","⭐","Отзывы и рейтинг"],
    ["messages","✉️","Сообщения"],["requests","📋","Заявки от клиентов"],["favorites","❤️","Избранное"],
    ["support","🆘","Поддержка"],["security","🔒","Безопасность"],["logout","🚪","Выход"]
  ];
  const clientMenu=[
    ["profile","👤","Профиль"],["settings","⚙️","Настройки"],["search","🔍","Поиск"],["myReviews","⭐","Мои отзывы"],
    ["messages","✉️","Сообщения"],["history","📋","История заявок"],["favorites","❤️","Избранное"],
    ["support","🆘","Поддержка"],["security","🔒","Безопасность"],["logout","🚪","Выход"]
  ];

  const defaults={
    role:"specialist",section:"profile",mobileChat:false,activeDialog:0,
    profile:{firstName:"Ирина",lastName:"Иванова",phone:"+7 900 123-45-67",email:"irina@example.ru",city:"Москва",about:"Репетитор по математике и няня с педагогическим образованием."},
    notifications:{requests:true,messages:true,sms:false,smsPhone:"+7 900 123-45-67"},
    education:[{place:"МПГУ",speciality:"Педагогическое образование",year:"2017"},{place:"Фоксфорд",speciality:"Методика онлайн-обучения",year:"2021"}],
    certificates:[],
    experience:[{position:"Репетитор",org:"Частная практика",period:"2018 — сейчас",duties:"Подготовка к ОГЭ, ЕГЭ, помощь с домашними заданиями."},{position:"Няня",org:"Семья",period:"2016 — 2018",duties:"Сопровождение, развивающие занятия, режим дня."}],
    recommendations:[{from:"Анна Петрова",text:"Ирина быстро нашла подход к ребёнку.",date:"12.04.2026"}],
    services:[{title:"Математика 5–9 класс",duration:"60 минут",price:1200,active:true},{title:"Подготовка к ОГЭ",duration:"90 минут",price:1800,active:true},{title:"Няня на вечер",duration:"3 часа",price:3000,active:false}],
    discount:10,paid:false,
    reviews:[{name:"Марина",rating:5,text:"Очень внимательный специалист.",answer:""},{name:"Олег",rating:5,text:"Понятные объяснения и дисциплина без давления.",answer:""},{name:"Екатерина",rating:4,text:"Хороший контакт с ребёнком.",answer:""}],
    dialogs:[{name:"Марина",last:"Спасибо, всё подходит",time:"14:20",unread:2,messages:[{from:"in",text:"Здравствуйте! Можно уточнить расписание?"},{from:"out",text:"Да, свободны вторник и четверг после 17:00."},{from:"in",text:"Спасибо, всё подходит"}]},{name:"Алексей",last:"Нужна подготовка к ОГЭ",time:"Вчера",unread:1,messages:[{from:"in",text:"Добрый день. Нужна подготовка к ОГЭ."},{from:"out",text:"Здравствуйте! Могу предложить пробное занятие."}]}],
    requests:[{name:"Марина",service:"Математика 5–9 класс",date:"02.06.2026",status:"active"},{name:"Алексей",service:"Подготовка к ОГЭ",date:"05.06.2026",status:"active"},{name:"Светлана",service:"Няня на вечер",date:"20.05.2026",status:"done"}],
    specialists:[{name:"Ирина Иванова",rating:4.8,subjects:"Математика, ОГЭ",price:1200,type:"Репетитор",exp:8},{name:"Ольга Смирнова",rating:4.9,subjects:"Английский, дошкольники",price:1500,type:"Репетитор",exp:6},{name:"Наталья Орлова",rating:4.7,subjects:"Няня, развитие",price:1000,type:"Няня",exp:10}],
    favorites:[],clientReviews:[],supportMessages:[],twoFA:false
  };

  let state=loadState(), authMode="login", requestTab="active", historyTab="active";

  function clone(x){return JSON.parse(JSON.stringify(x))}
  function loadState(){try{return Object.assign(clone(defaults),JSON.parse(localStorage.getItem(APP_KEY)||"{}"))}catch(e){return clone(defaults)}}
  function save(){localStorage.setItem(APP_KEY,JSON.stringify(state));sendHeight()}
  function users(){try{return JSON.parse(localStorage.getItem(USERS_KEY)||"[]")}catch(e){return[]}}
  function setUsers(u){localStorage.setItem(USERS_KEY,JSON.stringify(u))}
  function currentUser(){try{return JSON.parse(localStorage.getItem(CURRENT_KEY)||"null")}catch(e){return null}}
  function setCurrentUser(u){localStorage.setItem(CURRENT_KEY,JSON.stringify(u))}
  function isLogged(){return localStorage.getItem(LOGIN_KEY)==="true"}
  function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
  function initials(){return (state.profile.firstName[0]||"И")+(state.profile.lastName[0]||"И")}
  function menu(){return state.role==="specialist"?specialistMenu:clientMenu}
  function unread(){return state.dialogs.reduce((a,d)=>a+d.unread,0)}
  function newReq(){return state.requests.filter(r=>r.status==="active").length}
  function syncFromUser(){
    const u=currentUser(); if(!u)return;
    state.role=u.role;
    state.profile.firstName=u.firstName;state.profile.lastName=u.lastName;
    state.profile.email=u.email;state.profile.phone=u.phone;
  }
  function updateSavedUser(){
    const u=currentUser(); if(!u)return;
    const list=users(); const i=list.findIndex(x=>x.email===u.email);
    const updated=Object.assign({},u,{firstName:state.profile.firstName,lastName:state.profile.lastName,email:state.profile.email,phone:state.profile.phone,role:state.role});
    if(i>=0)list[i]=updated; setUsers(list); setCurrentUser(updated);
  }

  function render(){
    if(!isLogged()){renderAuth();return}
    syncFromUser();
    document.getElementById("root").innerHTML=`<div class="app">
      <header class="topbar">
        <button class="burger" id="burger">☰</button>
        <div class="logo">Специалист</div>
        <div class="role-switch"><button id="roleSpec">Я специалист</button><button id="roleClient">Я клиент</button></div>
        <div class="notify">🔔<b id="notifyCount">0</b></div><div class="avatar" id="topAvatar">ИИ</div>
      </header>
      <div class="drawer-overlay" id="drawerOverlay"></div>
      <div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="content" id="content"></main></div>
    </div>`;
    document.getElementById("roleSpec").classList.toggle("active",state.role==="specialist");
    document.getElementById("roleClient").classList.toggle("active",state.role==="client");
    document.getElementById("topAvatar").textContent=initials();
    document.getElementById("notifyCount").textContent=unread()+newReq();
    document.getElementById("burger").onclick=openDrawer;
    document.getElementById("drawerOverlay").onclick=closeDrawer;
    document.getElementById("roleSpec").onclick=()=>{state.role="specialist";state.section="profile";updateSavedUser();render()};
    document.getElementById("roleClient").onclick=()=>{state.role="client";state.section="profile";updateSavedUser();render()};
    renderSidebar();renderContent();save();
  }

  function renderAuth(){
    document.getElementById("root").innerHTML=`<div class="auth-screen"><div class="auth-wrap">
      <div class="auth-logo">Специалист</div>
      <div class="auth-card">${authMode==="login"?loginForm():registerForm()}</div>
    </div></div>`;
    if(authMode==="login")bindLogin();else bindRegister();
    sendHeight();
  }
  function loginForm(){return`<h1>Вход в личный кабинет</h1><div class="form">
    <label>Email<input id="loginEmail" type="email"><span class="field-error" id="eLoginEmail"></span></label>
    <label>Пароль<input id="loginPass" type="password"><span class="field-error" id="eLoginPass"></span></label>
    <label class="check-label"><input id="rememberMe" type="checkbox"> Запомнить меня</label>
    <div class="auth-error" id="loginError"></div><button id="loginBtn">Войти</button>
    <div class="auth-link"><a id="toRegister">Нет аккаунта? Зарегистрироваться</a></div></div>`}
  function registerForm(){return`<h1>Регистрация</h1><div class="form">
    ${authInput("regFirst","Имя")}${authInput("regLast","Фамилия")}${authInput("regEmail","Email","email")}
    ${authInput("regPhone","Телефон","tel")}${authInput("regPass","Пароль","password")}${authInput("regPass2","Повторите пароль","password")}
    <label>Роль<div class="role-choice"><label><input type="radio" name="regRole" value="specialist" checked> Я специалист</label><label><input type="radio" name="regRole" value="client"> Я клиент</label></div></label>
    <label class="check-label"><input id="agree" type="checkbox"> Я принимаю условия использования и политику конфиденциальности</label><span class="field-error" id="eAgree"></span>
    <button id="registerBtn">Зарегистрироваться</button><div class="auth-link"><a id="toLogin">Уже есть аккаунт? Войти</a></div></div>`}
  function authInput(id,label,type="text"){return`<label>${label}<input id="${id}" type="${type}"><span class="field-error" id="e${id}"></span></label>`}
  function err(id,msg){const el=document.getElementById(id);if(el)el.textContent=msg||""}
  function clearAuthErrors(){document.querySelectorAll(".field-error,.auth-error").forEach(e=>e.textContent="")}
  function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}
  function validPhone(v){return /^(\+7|8)[\s-]?\(?\d{3}\)?[\s-]?\d{3}[\s-]?\d{2}[\s-]?\d{2}$/.test(v)}
  function bindLogin(){
    document.getElementById("toRegister").onclick=()=>{authMode="register";renderAuth()};
    document.getElementById("loginBtn").onclick=()=>{
      clearAuthErrors();
      const email=document.getElementById("loginEmail").value.trim();
      const pass=document.getElementById("loginPass").value;
      let ok=true;
      if(!email){err("eLoginEmail","Email обязателен");ok=false}else if(!validEmail(email)){err("eLoginEmail","Введите email в формате email@domain.com");ok=false}
      if(!pass){err("eLoginPass","Пароль обязателен");ok=false}
      if(!ok)return;
      const u=users().find(x=>x.email.toLowerCase()===email.toLowerCase()&&x.password===pass);
      if(!u){document.getElementById("loginError").textContent="Неверный email или пароль";return}
      localStorage.setItem(LOGIN_KEY,"true");
      localStorage.setItem("rememberMe",document.getElementById("rememberMe").checked?"true":"false");
      setCurrentUser(u);
      state.role=u.role;state.section="profile";syncFromUser();save();render();
    };
  }
  function bindRegister(){
    document.getElementById("toLogin").onclick=()=>{authMode="login";renderAuth()};
    document.getElementById("registerBtn").onclick=()=>{
      clearAuthErrors();
      const first=v("regFirst"),last=v("regLast"),email=v("regEmail"),phone=v("regPhone"),pass=document.getElementById("regPass").value,pass2=document.getElementById("regPass2").value;
      const role=document.querySelector("input[name='regRole']:checked").value;
      let ok=true;
      if(!first){err("eregFirst","Имя обязательно");ok=false}
      if(!last){err("eregLast","Фамилия обязательна");ok=false}
      if(!email){err("eregEmail","Email обязателен");ok=false}else if(!validEmail(email)){err("eregEmail","Введите email в формате email@domain.com");ok=false}
      if(!phone){err("eregPhone","Телефон обязателен");ok=false}else if(!validPhone(phone)){err("eregPhone","Введите российский номер: +7 900 123-45-67");ok=false}
      if(!pass){err("eregPass","Пароль обязателен");ok=false}else if(pass.length<6){err("eregPass","Минимум 6 символов");ok=false}
      if(!pass2){err("eregPass2","Повторите пароль");ok=false}else if(pass!==pass2){err("eregPass2","Пароли не совпадают");ok=false}
      if(!document.getElementById("agree").checked){err("eAgree","Нужно принять условия");ok=false}
      if(users().some(u=>u.email.toLowerCase()===email.toLowerCase())){err("eregEmail","Такой email уже зарегистрирован");ok=false}
      if(!ok)return;
      const user={id:Date.now(),firstName:first,lastName:last,email,phone,password:pass,role};
      const list=users();list.push(user);setUsers(list);setCurrentUser(user);localStorage.setItem(LOGIN_KEY,"true");
      state.role=role;state.section="profile";state.profile.firstName=first;state.profile.lastName=last;state.profile.email=email;state.profile.phone=phone;save();render();
    };
  }
